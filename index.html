<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Green Stay Negombo - Room Booking</title>
  
  <!-- Tailwind CSS & FontAwesome Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Sinhala:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', 'Noto Sans Sinhala', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 pb-20">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [tab, setTab] = useState('dashboard');
      const [bookings, setBookings] = useState(() => {
        const saved = localStorage.getItem('gs_bookings');
        return saved ? JSON.parse(saved) : [
          { id: 1, guest: "සමන් කුමාර", phone: "0771234567", roomType: "Double", type: "Day Out", date: new Date().toISOString().split('T')[0] }
        ];
      });

      const [formData, setFormData] = useState({
        guest: '', phone: '', roomType: 'Double', type: 'Day Out', date: new Date().toISOString().split('T')[0]
      });

      useEffect(() => {
        localStorage.setItem('gs_bookings', JSON.stringify(bookings));
      }, [bookings]);

      const handleAddBooking = (e) => {
        e.preventDefault();
        if (!formData.guest || !formData.phone) return alert("කරුණාකර සියලු විස්තර ඇතුළත් කරන්න");
        setBookings([...bookings, { ...formData, id: Date.now() }]);
        setFormData({ guest: '', phone: '', roomType: 'Double', type: 'Day Out', date: new Date().toISOString().split('T')[0] });
        setTab('bookings');
      };

      const deleteBooking = (id) => {
        if (confirm("මෙම Booking එක ඉවත් කිරීමට අවශ්‍යද?")) {
          setBookings(bookings.filter(b => b.id !== id));
        }
      };

      return (
        <div class="max-w-md mx-auto bg-white min-h-screen shadow-xl relative pb-16">
          {/* Header */}
          <header class="bg-emerald-700 text-white p-4 sticky top-0 z-10 flex justify-between items-center shadow-md">
            <div>
              <h1 class="text-lg font-bold">Green Stay Negombo</h1>
              <p class="text-xs text-emerald-100">කාමර වෙන්කිරීම් කළමනාකරු</p>
            </div>
            <span class="bg-emerald-800 text-emerald-200 text-xs px-2.5 py-1 rounded-full border border-emerald-600 flex items-center gap-1">
              <span class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></span> Live
            </span>
          </header>

          {/* Content Body */}
          <main class="p-4">
            {tab === 'dashboard' && (
              <div class="space-y-4">
                <div class="grid grid-cols-2 gap-3">
                  <div class="bg-teal-50 border border-teal-200 p-4 rounded-xl text-center">
                    <i class="fa-solid fa-sun text-teal-600 text-xl mb-1"></i>
                    <span class="text-xs text-teal-700 font-bold block">අද Day Out</span>
                    <span class="text-2xl font-black text-teal-900">
                      {bookings.filter(b => b.type === 'Day Out').length} / 4
                    </span>
                  </div>
                  <div class="bg-indigo-50 border border-indigo-200 p-4 rounded-xl text-center">
                    <i class="fa-solid fa-moon text-indigo-600 text-xl mb-1"></i>
                    <span class="text-xs text-indigo-700 font-bold block">අද Night Out</span>
                    <span class="text-2xl font-black text-indigo-900">
                      {bookings.filter(b => b.type === 'Night Out').length} / 4
                    </span>
                  </div>
                </div>

                <div class="bg-emerald-50 border border-emerald-200 p-4 rounded-xl">
                  <h3 class="font-bold text-emerald-900 mb-2 text-sm flex items-center gap-2">
                    <i class="fa-solid fa-bell"></i> ඊළඟ Booking සටහන්
                  </h3>
                  {bookings.length === 0 ? (
                    <p class="text-xs text-slate-500">තවම Booking ඇතුළත් කර නැත.</p>
                  ) : (
                    <ul class="space-y-2">
                      {bookings.slice(0, 3).map(b => (
                        <li key={b.id} class="bg-white p-2.5 rounded-lg border border-emerald-100 text-xs flex justify-between items-center">
                          <div>
                            <p class="font-bold text-slate-800">{b.guest} ({b.roomType})</p>
                            <p class="text-slate-500">{b.date} • {b.type}</p>
                          </div>
                          <span class="text-emerald-700 font-semibold">{b.phone}</span>
                        </li>
                      ))}
                    </ul>
                  )}
                </div>
              </div>
            )}

            {tab === 'add' && (
              <form onSubmit={handleAddBooking} class="space-y-4">
                <h2 class="text-base font-bold text-slate-800 border-b pb-2">අලුත් Booking එකක් ඇතුළත් කරන්න</h2>
                <div>
                  <label class="text-xs font-semibold text-slate-600 block mb-1">පාරිභෝගිකයාගේ නම</label>
                  <input type="text" required value={formData.guest} onChange={e => setFormData({...formData, guest: e.target.value})} class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="උදා: නිමාලි පෙරේරා" />
                </div>
                <div>
                  <label class="text-xs font-semibold text-slate-600 block mb-1">දුරකථන අංකය</label>
                  <input type="tel" required value={formData.phone} onChange={e => setFormData({...formData, phone: e.target.value})} class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="07XXXXXXXX" />
                </div>
                <div class="grid grid-cols-2 gap-3">
                  <div>
                    <label class="text-xs font-semibold text-slate-600 block mb-1">කාමර වර්ගය</label>
                    <select value={formData.roomType} onChange={e => setFormData({...formData, roomType: e.target.value})} class="w-full border rounded-lg p-2.5 text-sm">
                      <option>Double Room</option>
                      <option>Cabana</option>
                      <option>Triple Room</option>
                      <option>Family Room</option>
                    </select>
                  </div>
                  <div>
                    <label class="text-xs font-semibold text-slate-600 block mb-1">Package එක</label>
                    <select value={formData.type} onChange={e => setFormData({...formData, type: e.target.value})} class="w-full border rounded-lg p-2.5 text-sm">
                      <option>Day Out</option>
                      <option>Night Out</option>
                      <option>Full Day</option>
                    </select>
                  </div>
                </div>
                <div>
                  <label class="text-xs font-semibold text-slate-600 block mb-1">දිනය</label>
                  <input type="date" value={formData.date} onChange={e => setFormData({...formData, date: e.target.value})} class="w-full border rounded-lg p-2.5 text-sm" />
                </div>
                <button type="submit" class="w-full bg-emerald-600 text-white font-bold py-3 rounded-xl shadow-md hover:bg-emerald-700 active:scale-95 transition">
                  Save Booking
                </button>
              </form>
            )}

            {tab === 'bookings' && (
              <div>
                <h2 class="text-base font-bold text-slate-800 border-b pb-2 mb-3">සියලුම Bookings ({bookings.length})</h2>
                {bookings.length === 0 ? (
                  <p class="text-xs text-slate-500 text-center py-8">Bookings කිසිවක් නැත.</p>
                ) : (
                  <div class="space-y-3">
                    {bookings.map(b => (
                      <div key={b.id} class="bg-white border border-slate-200 rounded-xl p-3 shadow-sm flex justify-between items-center">
                        <div>
                          <div class="flex items-center gap-2">
                            <span class="font-bold text-slate-800 text-sm">{b.guest}</span>
                            <span class="bg-slate-100 text-slate-600 text-[10px] px-2 py-0.5 rounded-full">{b.roomType}</span>
                          </div>
                          <p class="text-xs text-slate-500 mt-0.5"><i class="fa-solid fa-phone text-[10px]"></i> {b.phone}</p>
                          <p class="text-xs text-emerald-700 font-medium mt-1"><i class="fa-regular fa-calendar"></i> {b.date} ({b.type})</p>
                        </div>
                        <button onClick={() => deleteBooking(b.id)} class="text-red-500 p-2 hover:bg-red-50 rounded-lg">
                          <i class="fa-solid fa-trash-can"></i>
                        </button>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}
          </main>

          {/* Bottom Navigation */}
          <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t flex justify-around py-2 shadow-lg z-20">
            <button onClick={() => setTab('dashboard')} class={`flex flex-col items-center text-xs ${tab === 'dashboard' ? 'text-emerald-700 font-bold' : 'text-slate-400'}`}>
              <i class="fa-solid fa-chart-pie text-base mb-0.5"></i> මුල් පිටුව
            </button>
            <button onClick={() => setTab('add')} class={`flex flex-col items-center text-xs ${tab === 'add' ? 'text-emerald-700 font-bold' : 'text-slate-400'}`}>
              <i class="fa-solid fa-circle-plus text-lg text-emerald-600 mb-0.5"></i> එකතු කරන්න
            </button>
            <button onClick={() => setTab('bookings')} class={`flex flex-col items-center text-xs ${tab === 'bookings' ? 'text-emerald-700 font-bold' : 'text-slate-400'}`}>
              <i class="fa-solid fa-list-check text-base mb-0.5"></i> ලැයිස්තුව
            </button>
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
