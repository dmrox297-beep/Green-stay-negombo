<h2 className="text-sm font-bold border-b pb-2">අලුත් Room වර්ගයක්</h2>
<div><Lbl t="නම" /><input type="text" required placeholder="උදා: Deluxe Room" value={newRoomName} onChange={e => setNewRoomName(e.target.value)} className={inp} /></div>
<div><Lbl t="Room අංක (කොමාවෙන් වෙන් කරන්න)" /><input type="text" required placeholder="උදා: 301, 302, 303" value={newRoomTotal} onChange={e => setNewRoomTotal(e.target.value)} className={inp} /></div>
<button type="submit" className="w-full bg-emerald-700 text-white font-bold py-2.5 rounded-xl text-sm">Room වර්ගය Add කරන්න</button>
</form>
<div className={card}>
<h2 className="text-sm font-bold mb-2">Backup</h2>
<p className="text-xs text-slate-500 mb-3">සියලු දත්ත file එකක් විදියට phone එකට බාගන්න.</p>
<button type="button" onClick={fullBackup} className="w-full bg-slate-800 text-white font-bold py-2.5 rounded-xl text-sm"><i className="fa-solid fa-download"></i> සම්පූර්ණ Backup බාගන්න</button>
</div>
</div>
)}
</main>
{showPin && (
<Modal>
<form onSubmit={verifyPin} className="space-y-3">
<div className="flex justify-between items-center border-b pb-2">
<h3 className="text-sm font-bold">PIN ඇතුළත් කරන්න</h3>
<button type="button" onClick={() => setShowPin(false)} className="text-slate-400"><i className="fa-solid fa-xmark"></i></button>
</div>
<input type="password" required autoFocus placeholder="Admin / Owner PIN" value={pinInput} onChange={e => setPinInput(e.target.value)} className={inp} />
{pinError && <p className="text-xs text-rose-600">{pinError}</p>}
<div className="flex gap-2">
<button type="button" onClick={() => setShowPin(false)} className="flex-1 py-2 rounded-xl border border-slate-300 text-xs font-semibold">Cancel</button>
<button type="submit" className="flex-1 py-2 rounded-xl bg-emerald-700 text-white text-xs font-bold">Unlock</button>
</div>
</form>
</Modal>
)}
{delBooking && role === 'admin' && (
<Modal>
<form onSubmit={submitDeleteRequest} className="space-y-3">
<h3 className="text-sm font-bold border-b pb-2">Owner වෙත Delete Request යවන්න</h3>
<p className="text-xs text-slate-600">Booking: <b>{delBooking.guest}</b> ({delBooking.date})</p>
<div><Lbl t="Delete කිරීමට හේතුව" /><textarea rows="2" placeholder="උදා: Guest cancelled" value={delReason} onChange={e => setDelReason(e.target.value)} className={inp}></textarea></div>
<div className="flex gap-2">
<button type="button" onClick={() => setDelBooking(null)} className="flex-1 py-2 rounded-xl border border-slate-300 text-xs font-semibold">Cancel</button>
<button type="submit" className="flex-1 py-2 rounded-xl bg-amber-500 text-slate-900 text-xs font-bold">Request යවන්න</button>
</div>
</form>
</Modal>
)}
{editingBooking && isAdmin && (
<Modal>
<h3 className="text-sm font-bold border-b pb-2 mb-3">Booking Edit කරන්න</h3>
<BookingForm f={editingBooking} set={setEditingBooking} cfg={roomConfig} bookings={bookings} ignoreId={editingBooking.id} onSubmit={(e) => { e.preventDefault(); saveBooking(editingBooking, false); }} onCancel={() => setEditingBooking(null)} submitLabel="Save Changes" />
</Modal>
)}
{editingExpense && isAdmin && (
<Modal>
<h3 className="text-sm font-bold border-b pb-2 mb-3">වියදම Edit කරන්න</h3>
<ExpenseForm f={editingExpense} set={setEditingExpense} onSubmit={(e) => { e.preventDefault(); saveExpense(editingExpense, false); }} onCancel={() => setEditingExpense(null)} submitLabel="Save Changes" />
</Modal>
)}
{reqTarget && role === 'admin' && (
<Modal>
<form onSubmit={submitChangeReq} className="space-y-3">
<h3 className="text-sm font-bold border-b pb-2">Owner වෙත {reqTarget.kind === 'delete' ? 'Delete' : 'Edit'} Request යවන්න</h3>
<p className="text-xs text-slate-600">{reqTarget.label}</p>
<div><Lbl t={reqTarget.kind === 'delete' ? 'Delete කිරීමට හේතුව' : 'වෙනස් කළ යුතු දේ (උදා: මුදල 3500 විය යුතුයි)'} /><textarea rows="2" value={reqReason} onChange={e => setReqReason(e.target.value)} className={inp}></textarea></div>
<div className="flex gap-2">
<button type="button" onClick={() => setReqTarget(null)} className="flex-1 py-2 rounded-xl border border-slate-300 text-xs font-semibold">Cancel</button>
<button type="submit" className="flex-1 py-2 rounded-xl bg-amber-500 text-slate-900 text-xs font-bold">Request යවන්න</button>
</div>
</form>
</Modal>
)}
{editingAtt && isAdmin && (
<Modal>
<form onSubmit={saveAtt} className="space-y-3">
<h3 className="text-sm font-bold border-b pb-2">පැමිණීම Edit කරන්න</h3>
<p className="text-xs text-slate-600">{staffNm(editingAtt)} • {editingAtt.date}</p>
<select value={isPresent(editingAtt) ? 'present' : 'absent'} onChange={e => setEditingAtt({ ...editingAtt, status: e.target.value })} className={inp}>
<option value="present">✅ පැමිණියා</option><option value="absent">❌ නොපැමිණි</option>
</select>
{isPresent(editingAtt) && (
<div className="grid grid-cols-2 gap-3">
<div><Lbl t="In" /><input type="time" value={editingAtt.inTime || ''} onChange={e => setEditingAtt({ ...editingAtt, inTime: e.target.value })} className={inp} /></div>
<div><Lbl t="Out" /><input type="time" value={editingAtt.outTime || ''} onChange={e => setEditingAtt({ ...editingAtt, outTime: e.target.value })} className={inp} /></div>
</div>)}
<div className="flex gap-2">
<button type="button" onClick={() => setEditingAtt(null)} className="flex-1 py-2 rounded-xl border border-slate-300 text-xs font-semibold">Cancel</button>
<button type="submit" className="flex-1 py-2 rounded-xl bg-emerald-700 text-white text-xs font-bold">Save Changes</button>
</div>
</form>
</Modal>
)}
{editingLeave && isAdmin && (
<Modal>
<form onSubmit={saveLeave} className="space-y-3">
<h3 className="text-sm font-bold border-b pb-2">නිවාඩුව Edit කරන්න</h3>
<p className="text-xs text-slate-600">{staffNm(editingLeave)}</p>
<div className="grid grid-cols-2 gap-3">
<div><Lbl t="සිට (දිනය)" /><input type="date" required value={editingLeave.fromDate || ''} onChange={e => setEditingLeave({ ...editingLeave, fromDate: e.target.value })} className={inp} /></div>
<div><Lbl t="සිට (වේලාව)" /><input type="time" value={editingLeave.fromTime || ''} onChange={e => setEditingLeave({ ...editingLeave, fromTime: e.target.value })} className={inp} /></div>
<div><Lbl t="දක්වා (දිනය)" /><input type="date" required value={editingLeave.toDate || ''} onChange={e => setEditingLeave({ ...editingLeave, toDate: e.target.value })} className={inp} /></div>
<div><Lbl t="දක්වා (වේලාව)" /><input type="time" value={editingLeave.toTime || ''} onChange={e => setEditingLeave({ ...editingLeave, toTime: e.target.value })} className={inp} /></div>
</div>
<div><Lbl t="සටහන" /><input type="text" value={editingLeave.note || ''} onChange={e => setEditingLeave({ ...editingLeave, note: e.target.value })} className={inp} /></div>
<div className="flex gap-2">
<button type="button" onClick={() => setEditingLeave(null)} className="flex-1 py-2 rounded-xl border border-slate-300 text-xs font-semibold">Cancel</button>
<button type="submit" className="flex-1 py-2 rounded-xl bg-emerald-700 text-white text-xs font-bold">Save Changes</button>
</div>
</form>
</Modal>
)}
{editingBanquet && isAdmin && (
<Modal>
<h3 className="text-sm font-bold border-b pb-2 mb-3">Banquet Edit කරන්න</h3>
<BanquetForm f={editingBanquet} set={setEditingBanquet} onSubmit={(e) => { e.preventDefault(); saveBanquet(editingBanquet, false); }} onCancel={() => setEditingBanquet(null)} submitLabel="Save Changes" />
</Modal>
)}
<nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-slate-200 flex overflow-x-auto py-2 z-20 shadow-lg">
{navItems.map(([id, icon, label]) => (
<button key={id} onClick={() => setTab(id)} className={`shrink-0 min-w-[58px] flex flex-col items-center text-[11px] px-1 py-1 ${tab === id ? 'text-emerald-700 font-bold' : 'text-slate-500'}`}>
<i className={`fa-solid ${icon} text-base mb-0.5`}></i><span>{label}</span>
</button>
))}
</nav>
</div>
);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
