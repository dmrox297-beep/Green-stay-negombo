const OWNER_HASH = '08ddf2fc32804dade62ed11dd4858771393a46907c681ddc102f3d13bd0e9915';

// [check-in, check-out, check-out ඊළඟ දවසේද (1 = ඔව්)]
const PKG_TIMES = { 'Day Out': ['10:00', '17:00', 0], 'Night Out': ['18:30', '08:00', 1], '1 Night Standard': ['14:00', '11:00', 1] };
const SOURCE_OPTIONS = ['Nirmal', 'Nirmal booking sites', 'Travel Corner', 'Maple Leaf', 'වෙනත්'];
const SI_MONTHS = ['ජනවාරි','පෙබරවාරි','මාර්තු','අප්‍රේල්','මැයි','ජූනි','ජූලි','අගෝස්තු','සැප්තැම්බර්','ඔක්තෝබර්','නොවැම්බර්','දෙසැම්බර්'];
const SI_DAYS = ['ඉරි','සඳු','අඟ','බදා','බ්‍රහ','සිකු','සෙන'];

// ---------- helpers ----------
const normalizeSource = (s) => {
  if (!s) return 'වෙනත්';
  if (s === 'Nirmal booking.com') return 'Nirmal booking sites';
  if (s === 'Other') return 'වෙනත්';
  return SOURCE_OPTIONS.includes(s) ? s : 'වෙනත්'; // තවදුරටත් "Maple Leaf" වලට හරවන්නේ නැහැ
};
const pad = (n) => String(n).padStart(2, '0');
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const currentMonthISO = () => todayISO().slice(0, 7);
const formatMonthLabel = (ym) => { if (!ym) return ''; const [y, m] = ym.split('-').map(Number); return `${y} ${SI_MONTHS[m - 1]}`; };
const sha256 = async (s) => [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)))].map(b => b.toString(16).padStart(2, '0')).join('');

// minutes since epoch (UTC based, timezone ගැටලු නැහැ)
const ts = (iso, t, addDays = 0) => {
  const [y, m, d] = iso.split('-').map(Number);
  const [h, mi] = (t || '00:00').split(':').map(Number);
  return Date.UTC(y, m - 1, d + addDays, h || 0, mi || 0) / 60000;
};
// Booking එකක් කාමරය අල්ලාගන්නා නියම කාල පරාසය [start, end)
function getInterval(b) {
  if (!b || !b.date) return null;
  if (b.type === 'Custom Time') {
    const d1 = b.customCheckInDate || b.date;
    const d2 = b.customCheckOutDate && b.customCheckOutDate >= d1 ? b.customCheckOutDate : d1;
    const s = ts(d1, b.customCheckInTime || '00:00');
    let e = ts(d2, b.customCheckOutTime || '23:59');
    if (e <= s) e = s + 1;
    return [s, e];
  }
  const p = PKG_TIMES[b.type] || PKG_TIMES['Day Out'];
  return [ts(b.date, p[0]), ts(b.date, p[1], p[2])];
}
const overlaps = (a, b) => a && b && a[0] < b[1] && b[0] < a[1];
const dayRange = (iso) => [ts(iso, '00:00'), ts(iso, '00:00', 1)];
const bookingCoversDate = (b, iso) => !!iso && overlaps(getInterval(b), dayRange(iso));

const getRooms = (b) => Array.isArray(b.roomSelections) && b.roomSelections.length > 0
  ? b.roomSelections : [{ roomType: b.roomType, qty: Number(b.roomQty) || 1 }];
const getBookingRoomCount = (b, key = null) =>
  getRooms(b).filter(i => !key || i.roomType === key).reduce((s, i) => s + (Number(i.qty) || 1), 0);
const formatBookingRoomsText = (b) => getRooms(b).map(i => `${i.roomType} x${Number(i.qty) || 1}`).join(', ');

// ලබා දුන් කාල පරාසය තුළ එකවර කාමර කීයක් පාවිච්චි වෙනවාද (උපරිමය)
function peak(list, key, range) {
  const items = list.map(b => ({ iv: getInterval(b), q: getBookingRoomCount(b, key) }))
    .filter(x => x.q > 0 && overlaps(x.iv, range));
  const pts = [range[0], ...items.map(x => x.iv[0]).filter(t => t > range[0] && t < range[1])];
  return Math.max(0, ...pts.map(t => items.filter(x => x.iv[0] <= t && t < x.iv[1]).reduce((a, x) => a + x.q, 0)));
}
function findConflict(cand, ignoreId, list, cfg) {
  const iv = getInterval(cand);
  const others = list.filter(b => String(b.id) !== String(ignoreId));
  const req = {};
  getRooms(cand).forEach(i => { req[i.roomType] = (req[i.roomType] || 0) + Math.max(1, Number(i.qty) || 1); });
  for (const [k, q] of Object.entries(req)) {
    const cap = Number(cfg[k]?.total ?? 0);
    const used = peak(others, k, iv);
    if (used + q > cap) return `${cand.date} ${cfg[k]?.label || k} සඳහා එම වේලාවන්ට ඉතිරිව ඇත්තේ ${Math.max(0, cap - used)}/${cap} පමණි. Overbooking කළ නොහැක!`;
  }
  return null;
}

function renderPackageText(b) {
  if (b.type !== 'Custom Time') return b.type;
  const d1 = b.customCheckInDate || b.date || '';
  return `Custom (${d1} ${b.customCheckInTime || '--:--'} → ${b.customCheckOutDate || d1} ${b.customCheckOutTime || '--:--'})`;
}

const toMin = (t) => { if (!t) return null; const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const workedMins = (i, o) => { const a = toMin(i), b = toMin(o); return a == null || b == null ? 0 : (b - a + 1440) % 1440; };
const fmtH = (m) => `${Math.floor(m / 60)}h ${pad(m % 60)}m`;
const nowTime = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const leaveText = (l) => (l.fromTime || l.toTime) ? `${l.fromTime || '--:--'} → ${l.toTime || '--:--'}` : 'සම්පූර්ණ දවස';

function downloadCSV(name, rows) {
  const csv = '\uFEFF' + rows.map(r => r.map(c => `"${String(c ?? '').replace(/"/g, '""')}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = name; a.click();
}
function downloadJSON(name, obj) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' }));
  a.download = name; a.click();
}

// ---------- Firebase (offline queue සහිත) ----------
const BASE = (FIREBASE_DB_URL || '').trim().replace(/\/+$/, '');
const fbUrl = (p) => `${BASE}/greenStayNegombo${p ? '/' + p : ''}.json`;
let queue = (() => { try { return JSON.parse(localStorage.getItem('gs_pending_v1') || '[]'); } catch (e) { return []; } })();
const saveQ = () => localStorage.setItem('gs_pending_v1', JSON.stringify(queue));
async function flush() {
  while (queue.length) {
    const op = queue[0];
    try {
      const r = await fetch(fbUrl(op.path), op.del ? { method: 'DELETE' } : { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(op.data) });
      if (!r.ok && r.status >= 500) return false;
      queue.shift(); saveQ(); // 4xx (Rules වැරදි වගේ) නම් නැවත නැවත උත්සාහ නොකර අත්හරිනවා
    } catch (e) { return false; }
  }
  return true;
}
async function sendOp(op) { queue.push(op); saveQ(); return flush(); }

// Firebase map/array -> clean array; id එකට සමාන නොවන key තියෙන ඒවා හදන්න fixes ලබා දෙනවා
function toArray(raw, col) {
  const list = [], fixes = [];
  if (!raw || typeof raw !== 'object') return { list, fixes };
  Object.entries(raw).forEach(([key, val]) => {
    if (!val || typeof val !== 'object') return;
    const id = val.id != null ? val.id : (Number.isNaN(Number(key)) ? key : Number(key));
    const rec = { ...val, id };
    list.push(rec);
    if (String(key) !== String(id)) {
      fixes.push({ path: `${col}/${id}`, data: rec });
      fixes.push({ path: `${col}/${key}`, del: true });
    }
  });
  return { list, fixes };
}

const inp = 'w-full p-2 text-sm border border-slate-300 rounded-lg bg-white focus:outline-none focus:border-emerald-600';
const Lbl = ({ t }) => <label className="block text-xs font-semibold text-slate-600 mb-1">{t}</label>;

// Add සහ Edit දෙකටම පාවිච්චි වන එකම form එක
function BookingForm({ f, set, cfg, onSubmit, onCancel, submitLabel }) {
  const keys = Object.keys(cfg);
  const upd = (k, v) => set({ ...f, [k]: v });
  const rows = f.roomSelections;
  const setRow = (i, k, v) => set({ ...f, roomSelections: rows.map((r, j) => j === i ? { ...r, [k]: k === 'qty' ? Math.max(1, Number(v) || 1) : v } : r) });
  return (
    <form onSubmit={onSubmit} className="space-y-3">
      <div><Lbl t="Guest Name" /><input type="text" required placeholder="අමුත්තාගේ නම" value={f.guest} onChange={e => upd('guest', e.target.value)} className={inp} /></div>
      <div className="grid grid-cols-2 gap-3">
        <div><Lbl t="Price (Rs.)" /><input type="number" required min="0" value={f.price} onChange={e => upd('price', e.target.value)} className={inp} /></div>
        <div><Lbl t="Advance (Rs.)" /><input type="number" min="0" value={f.advance || ''} onChange={e => upd('advance', e.target.value)} className={inp} /></div>
      </div>
      <div><Lbl t="කාණ්ඩය (Source)" />
        <select value={normalizeSource(f.source)} onChange={e => upd('source', e.target.value)} className={inp}>
          {SOURCE_OPTIONS.map(s => <option key={s} value={s}>{s}</option>)}
        </select></div>
      <div><Lbl t="සටහන් (Notes)" /><textarea rows="2" value={f.notes || ''} onChange={e => upd('notes', e.target.value)} className={inp}></textarea></div>
      <div className="space-y-2 bg-slate-50 p-3 rounded-xl border border-slate-200">
        <div className="flex justify-between items-center">
          <span className="text-xs font-bold text-slate-700">Room Types & Quantity</span>
          <button type="button" onClick={() => set({ ...f, roomSelections: [...rows, { roomType: keys[0], qty: 1 }] })} className="text-xs font-bold text-emerald-700 bg-emerald-50 border border-emerald-200 px-2.5 py-1 rounded-lg">+ තව Room එකක්</button>
        </div>
        {rows.map((r, i) => (
          <div key={i} className="grid grid-cols-12 gap-2 items-center">
            <div className="col-span-7"><select value={r.roomType} onChange={e => setRow(i, 'roomType', e.target.value)} className={inp}>
              {keys.map(k => <option key={k} value={k}>{cfg[k]?.label || k}</option>)}</select></div>
            <div className="col-span-3"><input type="number" min="1" value={r.qty} onChange={e => setRow(i, 'qty', e.target.value)} className={inp + ' text-center font-bold'} /></div>
            <div className="col-span-2 flex justify-end">{rows.length > 1 && <button type="button" onClick={() => set({ ...f, roomSelections: rows.filter((_, j) => j !== i) })} className="text-rose-600 p-2 text-xs"><i className="fa-solid fa-trash"></i></button>}</div>
          </div>
        ))}
      </div>
      <div className="grid grid-cols-2 gap-3">
        <div><Lbl t="දිනය (Date)" /><input type="date" required value={f.date} onChange={e => set({ ...f, date: e.target.value, customCheckInDate: e.target.value })} className={inp} /></div>
        <div><Lbl t="Package" /><select value={f.type} onChange={e => set({ ...f, type: e.target.value, customCheckInDate: f.customCheckInDate || f.date, customCheckOutDate: f.customCheckOutDate || f.date })} className={inp}>
          {PACKAGES.map(p => <option key={p.id} value={p.id}>{p.label}</option>)}</select></div>
      </div>
      {f.type === 'Custom Time' && (
        <div className="space-y-3 bg-slate-50 p-3 rounded-xl border border-slate-200">
          <div><p className="text-xs font-bold text-slate-700 mb-1.5">Check-in දිනය සහ වේලාව</p>
            <div className="grid grid-cols-2 gap-2">
              <input type="date" value={f.customCheckInDate || f.date} onChange={e => set({ ...f, customCheckInDate: e.target.value, date: e.target.value })} className={inp} />
              <input type="time" value={f.customCheckInTime || ''} onChange={e => upd('customCheckInTime', e.target.value)} className={inp} />
            </div></div>
          <div><p className="text-xs font-bold text-slate-700 mb-1.5">Check-out දිනය සහ වේලාව</p>
            <div className="grid grid-cols-2 gap-2">
              <input type="date" value={f.customCheckOutDate || f.customCheckInDate || f.date} onChange={e => upd('customCheckOutDate', e.target.value)} className={inp} />
              <input type="time" value={f.customCheckOutTime || ''} onChange={e => upd('customCheckOutTime', e.target.value)} className={inp} />
            </div></div>
        </div>
      )}
      <div className="flex gap-2 pt-1">
        {onCancel && <button type="button" onClick={onCancel} className="flex-1 py-2.5 rounded-xl border border-slate-300 text-xs font-semibold text-slate-700">Cancel</button>}
        <button type="submit" className="flex-1 py-2.5 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white text-sm font-bold">{submitLabel}</button>
      </div>
    </form>
  );
}

function App() {
  // PIN එක එක් වරක් ගැහුවාම phone එකේ මතක තබාගන්නවා (Log out කරන තුරු)
  const [role, setRole] = useState(() => {
    try { const h = localStorage.getItem('gs_login_v2'); return h === OWNER_HASH ? 'owner' : h === ADMIN_HASH ? 'admin' : 'view'; } catch (e) { return 'view'; }
  });
  const isAdmin = role === 'admin' || role === 'owner';
  const isOwner = role === 'owner';
  const [showPin, setShowPin] = useState(false);
  const [pinInput, setPinInput] = useState('');
  const [pinError, setPinError] = useState('');
  const failsRef = useRef({ n: 0, until: 0 });

  const [tab, setTab] = useState('dashboard');
  const [sync, setSync] = useState(BASE ? 'Syncing' : 'Local');

  const load = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
  const [roomConfig, setRoomConfig] = useState(() => load('gs_room_config_v1', DEFAULT_ROOM_CONFIG));
  const [bookings, setBookings] = useState(() => { const l = load('gs_bookings_v4', []); return Array.isArray(l) ? l.map(b => ({ ...b, source: normalizeSource(b.source) })) : []; });
  const [deleteRequests, setDeleteRequests] = useState(() => load('gs_delete_requests_v1', []));
  const [expenses, setExpenses] = useState(() => load('gs_expenses_v1', []));
  const [staff, setStaff] = useState(() => load('gs_staff_v1', []));
  const [attendance, setAttendance] = useState(() => load('gs_attendance_v1', []));
  const [leaves, setLeaves] = useState(() => load('gs_leaves_v1', []));
  const [changeRequests, setChangeRequests] = useState(() => load('gs_change_requests_v1', []));

  const roomKeys = Object.keys(roomConfig);
  const defaultRoomKey = roomKeys[0] || 'Double';
  const [newRoomName, setNewRoomName] = useState('');
  const [newRoomTotal, setNewRoomTotal] = useState('1');
  const [formData, setFormData] = useState(() => emptyBooking('Double'));
  const [editingBooking, setEditingBooking] = useState(null);
  const [editingExpense, setEditingExpense] = useState(null);
  const [delBooking, setDelBooking] = useState(null);
  const [delReason, setDelReason] = useState('');
  const [calYear, setCalYear] = useState(() => new Date().getFullYear());
  const [calMonth, setCalMonth] = useState(() => new Date().getMonth());
  const [selDate, setSelDate] = useState(todayISO());
  const [bookingMonth, setBookingMonth] = useState(currentMonthISO());
  const [expenseMonth, setExpenseMonth] = useState(currentMonthISO());
  const [expForm, setExpForm] = useState({ title: '', amount: '', date: todayISO() });
  const verRef = useRef(0);

  useEffect(() => { localStorage.removeItem('gs_user_role_v1'); }, []);
  useEffect(() => { localStorage.setItem('gs_room_config_v1', JSON.stringify(roomConfig)); }, [roomConfig]);
  useEffect(() => { localStorage.setItem('gs_bookings_v4', JSON.stringify(bookings)); }, [bookings]);
  useEffect(() => { localStorage.setItem('gs_delete_requests_v1', JSON.stringify(deleteRequests)); }, [deleteRequests]);
  useEffect(() => { localStorage.setItem('gs_expenses_v1', JSON.stringify(expenses)); }, [expenses]);
  useEffect(() => { localStorage.setItem('gs_staff_v1', JSON.stringify(staff)); }, [staff]);
  useEffect(() => { localStorage.setItem('gs_attendance_v1', JSON.stringify(attendance)); }, [attendance]);
  useEffect(() => { localStorage.setItem('gs_leaves_v1', JSON.stringify(leaves)); }, [leaves]);
  useEffect(() => { localStorage.setItem('gs_change_requests_v1', JSON.stringify(changeRequests)); }, [changeRequests]);

  // සියලු Firebase writes/deletes මෙතනින්. ඇත්තටම යැව්වාද (true) නැත්නම් queue එකේ තියෙනවාද (false) කියලා දෙනවා.
  const write = useCallback(async (path, data) => {
    if (!BASE) return true;
    verRef.current++;
    const ok = await sendOp(data === null ? { path, del: true } : { path, data });
    setSync(ok ? 'Live' : `Offline (${queue.length} pending)`);
    return ok;
  }, []);

  const pull = useCallback(async () => {
    if (!BASE) { setSync('Local'); return null; }
    const v = verRef.current;
    try {
      if (!(await flush())) { setSync(`Offline (${queue.length} pending)`); return null; }
      const res = await fetch(fbUrl('') + `?t=${Date.now()}`, { cache: 'no-store' });
      if (!res.ok) throw new Error('net');
      const data = await res.json();
      if (verRef.current !== v || queue.length) return null; // අතරතුර වෙනස්කමක් වුණා නම් පරණ data දාන්නේ නැහැ

      const b = toArray(data?.bookings, 'bookings');
      const e = toArray(data?.expenses, 'expenses');
      const r = toArray(data?.deleteRequests, 'deleteRequests');
      const st = toArray(data?.staff, 'staff');
      const at = toArray(data?.attendance, 'attendance');
      const lv = toArray(data?.leaves, 'leaves');
      const cr = toArray(data?.changeRequests, 'changeRequests');
      const remoteBookings = b.list.map(x => ({ ...x, source: normalizeSource(x.source) }));
      const remoteRooms = data?.roomConfig && typeof data.roomConfig === 'object' ? data.roomConfig : DEFAULT_ROOM_CONFIG;

      // වැරදි key යටතේ තිබූ records (මකද්දී ආපහු එන ඒවා) ස්වයංක්‍රීයව නිවැරදි key එකට මාරු කරනවා
      const fixes = [...b.fixes, ...e.fixes, ...r.fixes, ...st.fixes, ...at.fixes, ...lv.fixes, ...cr.fixes];
      if (fixes.length) { verRef.current++; fixes.forEach(op => queue.push(op)); saveQ(); flush(); }

      const same = (a, c) => JSON.stringify(a) === JSON.stringify(c);
      setBookings(p => same(p, remoteBookings) ? p : remoteBookings);
      setExpenses(p => same(p, e.list) ? p : e.list);
      setDeleteRequests(p => same(p, r.list) ? p : r.list);
      setStaff(p => same(p, st.list) ? p : st.list);
      setAttendance(p => same(p, at.list) ? p : at.list);
      setLeaves(p => same(p, lv.list) ? p : lv.list);
      setChangeRequests(p => same(p, cr.list) ? p : cr.list);
      setRoomConfig(p => same(p, remoteRooms) ? p : remoteRooms);
      setSync('Live');
      return { remoteBookings, remoteExpenses: e.list, remoteRequests: r.list, remoteChange: cr.list };
    } catch (err) { setSync('Offline'); return null; }
  }, []);

  // තත්පර 10කට වරක් (පිටුව පෙනෙන විට පමණක්) + app එකට ආපසු ආ විට
  useEffect(() => {
    if (!BASE) return;
    const tick = () => { if (!document.hidden) pull(); };
    tick();
    const id = setInterval(tick, 10000);
    document.addEventListener('visibilitychange', tick);
    return () => { clearInterval(id); document.removeEventListener('visibilitychange', tick); };
  }, [pull]);

  useEffect(() => {
    if (!isAdmin && ['add', 'bookings', 'expenses', 'staff', 'rooms'].includes(tab)) setTab('dashboard');
  }, [isAdmin, tab]);

  const roleClick = () => {
    if (role !== 'view') { if (confirm('Log out කරන්නද?')) { localStorage.removeItem('gs_login_v2'); setRole('view'); } }
    else { setPinInput(''); setPinError(''); setShowPin(true); }
  };
  const verifyPin = async (e) => {
    e.preventDefault();
    const f = failsRef.current;
    if (Date.now() < f.until) return setPinError('වැරදි උත්සාහ වැඩියි. තත්පර 30කින් නැවත උත්සාහ කරන්න.');
    if (!window.crypto?.subtle) return setPinError('මෙම browser එකේ PIN පරීක්ෂාව වැඩ කරන්නේ නැහැ (https ඕන).');
    const h = await sha256(pinInput.trim());
    if (h === OWNER_HASH || h === ADMIN_HASH) { setRole(h === OWNER_HASH ? 'owner' : 'admin'); localStorage.setItem('gs_login_v2', h); }
    else {
      f.n++; if (f.n >= 5) { f.until = Date.now() + 30000; f.n = 0; }
      return setPinError('PIN අංකය වැරදියි. නැවත උත්සාහ කරන්න.');
    }
    f.n = 0; setShowPin(false); setPinInput(''); setPinError('');
  };

  const pushRoomConfig = async (cfg) => { setRoomConfig(cfg); await write('roomConfig', cfg); };
  const adjustRoom = (key, delta) => {
    if (!isAdmin || !roomConfig[key]) return;
    pushRoomConfig({ ...roomConfig, [key]: { ...roomConfig[key], total: Math.max(0, Number(roomConfig[key].total || 0) + delta) } });
  };
  const addRoomType = async (e) => {
    e.preventDefault();
    if (!isAdmin) return;
    const name = newRoomName.trim();
    if (!name) return alert('කරුණාකර Room වර්ගයේ නම ඇතුළත් කරන්න.');
    if (roomConfig[name]) return alert('මෙම Room වර්ගය දැනටමත් පවතී.');
    const st = EXTRA_STYLES[roomKeys.length % EXTRA_STYLES.length];
    await pushRoomConfig({ ...roomConfig, [name]: { label: name, total: Math.max(0, Number(newRoomTotal) || 0), ...st } });
    setNewRoomName(''); setNewRoomTotal('1');
  };

  const buildBooking = (f, id, status) => {
    const custom = f.type === 'Custom Time';
    const sel = f.roomSelections.map(i => ({ roomType: i.roomType || defaultRoomKey, qty: Math.max(1, Number(i.qty) || 1) }));
    const date = custom && f.customCheckInDate ? f.customCheckInDate : f.date;
    return {
      ...f, id, status,
      guest: f.guest.trim(), price: Number(f.price), advance: Number(f.advance) || 0,
      source: normalizeSource(f.source), notes: (f.notes || '').trim(),
      roomType: sel[0].roomType, roomQty: sel.reduce((s, i) => s + i.qty, 0), roomSelections: sel, date,
      customCheckInDate: custom ? date : '', customCheckInTime: custom ? (f.customCheckInTime || '') : '',
      customCheckOutDate: custom ? (f.customCheckOutDate || date) : '', customCheckOutTime: custom ? (f.customCheckOutTime || '') : ''
    };
  };

  const saveBooking = async (f, isNew) => {
    if (!isAdmin) return;
    if (!f.guest.trim() || f.price === '') return alert('කරුණාකර Guest Name සහ Price ඇතුළත් කරන්න.');
    const latest = await pull();
    const base = latest ? latest.remoteBookings : bookings;
    const nb = buildBooking(f, isNew ? Date.now() : f.id, isNew ? 'pending' : (f.status || 'pending'));
    const c = findConflict(nb, nb.id, base, roomConfig);
    if (c) return alert(c);

    setBookings([nb, ...base.filter(b => String(b.id) !== String(nb.id))]);
    const ok = await write(`bookings/${nb.id}`, nb);
    if (!ok) alert('Internet නැති නිසා Booking එක phone එකේ save වුණා. Internet ආපු විට ස්වයංක්‍රීයව server එකට යනවා.');
    else if (isNew) {
      // තවත් Admin කෙනෙක් එකම වෙලාවේ book කළාද කියා නැවත පරීක්ෂා කිරීම (කලින් id එක තියෙන Booking එක රැඳෙනවා)
      const l2 = await pull();
      if (l2) {
        const earlier = l2.remoteBookings.filter(b => Number(b.id) < nb.id);
        const c2 = findConflict(nb, nb.id, earlier, roomConfig);
        if (c2) {
          setBookings(p => p.filter(b => b.id !== nb.id));
          await write(`bookings/${nb.id}`, null);
          return alert('මේ අතරතුර වෙනත් කෙනෙක් එම කාමරයම Book කළා. ඔබේ Booking එක ඉවත් කළා.\n' + c2);
        }
      }
    }
    if (isNew) { setFormData(emptyBooking(defaultRoomKey)); setBookingMonth(nb.date.slice(0, 7)); setTab('bookings'); }
    else setEditingBooking(null);
  };

  const setStatus = async (id, status) => {
    if (!isAdmin) return;
    const t = bookings.find(b => String(b.id) === String(id));
    if (!t) return;
    const u = { ...t, status };
    setBookings(bookings.map(b => String(b.id) === String(id) ? u : b));
    await write(`bookings/${id}`, u);
  };

  const submitDeleteRequest = async (e) => {
    e.preventDefault();
    if (!isAdmin || !delBooking) return;
    const latest = await pull();
    const base = latest ? latest.remoteRequests : deleteRequests;
    if (base.some(r => String(r.bookingId) === String(delBooking.id))) { alert('මෙම Booking එක සඳහා Delete Request එකක් දැනටමත් යවා ඇත.'); return setDelBooking(null); }
    const req = {
      id: Date.now(), bookingId: delBooking.id, requestedBy: 'Admin', requestedAt: new Date().toLocaleString('si-LK'),
      reason: delReason.trim() || 'හේතුවක් සඳහන් කර නැත',
      snapshot: { guest: delBooking.guest, date: delBooking.date, rooms: formatBookingRoomsText(delBooking), price: Number(delBooking.price) || 0, source: normalizeSource(delBooking.source) }
    };
    setDeleteRequests([req, ...base]);
    await write(`deleteRequests/${req.id}`, req);
    setDelBooking(null); setDelReason('');
    alert('Delete Request එක Owner වෙත යවන ලදී.');
  };
  const removeBooking = async (id, reqIds = []) => {
    setBookings(p => p.filter(b => String(b.id) !== String(id)));
    setDeleteRequests(p => p.filter(r => String(r.bookingId) !== String(id)));
    await write(`bookings/${id}`, null);
    for (const rid of reqIds) await write(`deleteRequests/${rid}`, null);
  };
  const ownerDelete = (id) => {
    if (!isOwner || !confirm('Owner ලෙස මෙම Booking එක සම්පූර්ණයෙන්ම ඉවත් කිරීමට අවශ්‍යද?')) return;
    removeBooking(id, deleteRequests.filter(r => String(r.bookingId) === String(id)).map(r => r.id));
  };
  const rejectRequest = async (rid) => {
    if (!isOwner) return;
    setDeleteRequests(p => p.filter(r => String(r.id) !== String(rid)));
    await write(`deleteRequests/${rid}`, null);
  };

  const saveExpense = async (f, isNew) => {
    if (!isAdmin || (!isNew && !isOwner)) return;
    if (!f.title.trim() || f.amount === '') return alert('කරුණාකර වියදම් විස්තරය සහ මුදල ඇතුළත් කරන්න.');
    const latest = await pull();
    const base = latest ? latest.remoteExpenses : expenses;
    const ex = { id: isNew ? Date.now() : f.id, title: f.title.trim(), amount: Number(f.amount), date: f.date };
    setExpenses([ex, ...base.filter(x => String(x.id) !== String(ex.id))]);
    await write(`expenses/${ex.id}`, ex);
    if (isNew) { setExpenseMonth(ex.date.slice(0, 7)); setExpForm({ title: '', amount: '', date: todayISO() }); }
    else { setEditingExpense(null); clearReqs('expenses', ex.id); }
  };
  // ---------- Staff / Attendance / Leave / Change requests ----------
  const [attDate, setAttDate] = useState(todayISO());
  const [staffMonth, setStaffMonth] = useState(currentMonthISO());
  const [newStaff, setNewStaff] = useState('');
  const [leaveForm, setLeaveForm] = useState({ staffId: '', date: todayISO(), fromTime: '', toTime: '', note: '' });
  const [editingAtt, setEditingAtt] = useState(null);
  const [editingLeave, setEditingLeave] = useState(null);
  const [reqTarget, setReqTarget] = useState(null);
  const [reqReason, setReqReason] = useState('');
  const [markTimes, setMarkTimes] = useState({});

  const staffNm = (r) => staff.find(x => String(x.id) === String(r.staffId))?.name || r.staffName || '?';
  const hasReq = (col, id) => changeRequests.some(r => r.col === col && String(r.recId) === String(id));
  const clearReqs = async (col, id) => {
    const m = changeRequests.filter(r => r.col === col && String(r.recId) === String(id));
    if (!m.length) return;
    setChangeRequests(p => p.filter(r => !m.includes(r)));
    for (const r of m) await write(`changeRequests/${r.id}`, null);
  };
  const rejectChangeReq = async (id) => {
    if (!isOwner) return;
    setChangeRequests(p => p.filter(r => r.id !== id));
    await write(`changeRequests/${id}`, null);
  };
  const ownerDeleteRec = async (col, id, ask = true) => {
    if (!isOwner || (ask && !confirm('මෙය ඉවත් කිරීමට අවශ්‍යද?'))) return;
    ({ expenses: setExpenses, attendance: setAttendance, leaves: setLeaves })[col](p => p.filter(x => String(x.id) !== String(id)));
    await write(`${col}/${id}`, null);
    await clearReqs(col, id);
  };
  const startEdit = (col, rec) => col === 'expenses' ? setEditingExpense({ ...rec }) : col === 'attendance' ? setEditingAtt({ ...rec }) : setEditingLeave({ ...rec });
  const openFromReq = (req) => {
    const rec = ({ expenses, attendance, leaves })[req.col].find(x => String(x.id) === String(req.recId));
    if (!rec) { alert('මෙම සටහන දැන් නැහැ.'); return rejectChangeReq(req.id); }
    startEdit(req.col, rec);
  };
  const submitChangeReq = async (e) => {
    e.preventDefault();
    if (!isAdmin || !reqTarget) return;
    const { kind, col, rec, label } = reqTarget;
    if (hasReq(col, rec.id)) { alert('මෙම සටහන සඳහා Request එකක් දැනටමත් යවා ඇත.'); return setReqTarget(null); }
    const req = { id: Date.now(), kind, col, recId: rec.id, label, reason: reqReason.trim() || 'හේතුවක් සඳහන් කර නැත', requestedAt: new Date().toLocaleString('si-LK') };
    setChangeRequests(p => [req, ...p]); setReqTarget(null);
    await write(`changeRequests/${req.id}`, req);
    alert('Request එක Owner වෙත යවන ලදී.');
  };
  // Owner ට Edit/Delete; Admin ට Request බොත්තම්
  const recActions = (col, rec, label) => {
    if (isOwner) return (
      <div className="flex gap-2 justify-end">
        <button type="button" onClick={() => startEdit(col, rec)} className="px-2.5 py-1 rounded-lg text-xs font-semibold bg-slate-100 text-slate-700"><i className="fa-solid fa-pen"></i> Edit</button>
        <button type="button" onClick={() => ownerDeleteRec(col, rec.id)} className="px-2.5 py-1 rounded-lg text-xs font-semibold bg-rose-50 text-rose-700 border border-rose-200"><i className="fa-solid fa-trash"></i></button>
      </div>);
    if (hasReq(col, rec.id)) return <p className="text-[11px] text-amber-800 bg-amber-50 border border-amber-200 px-2 py-0.5 rounded inline-block font-semibold">Request Pending</p>;
    return (
      <div className="flex gap-2 justify-end">
        <button type="button" onClick={() => { setReqTarget({ kind: 'edit', col, rec, label }); setReqReason(''); }} className="px-2.5 py-1 rounded-lg text-xs font-semibold bg-amber-50 text-amber-800 border border-amber-300">Request Edit</button>
        <button type="button" onClick={() => { setReqTarget({ kind: 'delete', col, rec, label }); setReqReason(''); }} className="px-2.5 py-1 rounded-lg text-xs font-semibold bg-amber-50 text-amber-800 border border-amber-300">Request Delete</button>
      </div>);
  };

  const addStaff = async (e) => {
    e.preventDefault();
    const name = newStaff.trim();
    if (!isAdmin || !name) return;
    if (staff.some(x => x.name.toLowerCase() === name.toLowerCase())) return alert('මෙම නම දැනටමත් ඇත.');
    const st = { id: Date.now(), name };
    setStaff(p => [...p, st]); setNewStaff('');
    await write(`staff/${st.id}`, st);
  };
  const renameStaff = async (st) => {
    if (!isOwner) return;
    const n = (prompt('අලුත් නම', st.name) || '').trim();
    if (!n || n === st.name) return;
    const u = { ...st, name: n };
    setStaff(p => p.map(x => x.id === st.id ? u : x));
    await write(`staff/${st.id}`, u);
  };
  const removeStaff = async (st) => {
    if (!isOwner || !confirm(`${st.name} ඉවත් කරන්නද? (පැරණි වාර්තා මැකෙන්නේ නැහැ)`)) return;
    setStaff(p => p.filter(x => x.id !== st.id));
    await write(`staff/${st.id}`, null);
  };
  // Admin ට හිස් In / Out එක පමණක් පුරවන්න පුළුවන්. දැනටමත් ඇති වේලාවක් වෙනස් කරන්න Owner ට පමණි.
  const markAtt = async (st, date, field, time) => {
    if (!isAdmin || !time) return;
    const id = `a_${st.id}_${date}`;
    const cur = attendance.find(a => a.id === id);
    if (cur && cur[field]) return alert('මෙය දැනටමත් සටහන් කර ඇත. වෙනස් කිරීමට Owner ට Request කරන්න.');
    const rec = { ...(cur || { id, staffId: st.id, staffName: st.name, date, inTime: '', outTime: '' }), [field]: time };
    setAttendance(p => [rec, ...p.filter(a => a.id !== id)]);
    await write(`attendance/${id}`, rec);
  };
  const saveAtt = async (e) => {
    e.preventDefault();
    if (!isOwner) return;
    const rec = { ...editingAtt, inTime: editingAtt.inTime || '', outTime: editingAtt.outTime || '' };
    setAttendance(p => p.map(a => a.id === rec.id ? rec : a)); setEditingAtt(null);
    await write(`attendance/${rec.id}`, rec);
    await clearReqs('attendance', rec.id);
  };
  const addLeave = async (e) => {
    e.preventDefault();
    if (!isAdmin) return;
    const st = staff.find(x => String(x.id) === String(leaveForm.staffId));
    if (!st) return alert('Staff කෙනෙක් තෝරන්න.');
    const lv = { id: Date.now(), staffId: st.id, staffName: st.name, date: leaveForm.date, fromTime: leaveForm.fromTime, toTime: leaveForm.toTime, note: leaveForm.note.trim() };
    setLeaves(p => [lv, ...p]); setStaffMonth(lv.date.slice(0, 7));
    setLeaveForm({ ...leaveForm, fromTime: '', toTime: '', note: '' });
    await write(`leaves/${lv.id}`, lv);
  };
  const saveLeave = async (e) => {
    e.preventDefault();
    if (!isOwner) return;
    const lv = { ...editingLeave };
    setLeaves(p => p.map(x => x.id === lv.id ? lv : x)); setEditingLeave(null);
    await write(`leaves/${lv.id}`, lv);
    await clearReqs('leaves', lv.id);
  };

  const dayRows = staff.map(x => ({
    st: x, rec: attendance.find(a => a.id === `a_${x.id}_${attDate}`),
    lv: leaves.filter(l => l.date === attDate && String(l.staffId) === String(x.id))
  }));
  const attMonth = attendance.filter(a => a.date && a.date.startsWith(staffMonth)).sort((a, b) => a.date.localeCompare(b.date));
  const leaveMonth = leaves.filter(l => l.date && l.date.startsWith(staffMonth)).sort((a, b) => a.date.localeCompare(b.date));
  const staffSummary = staff.map(x => {
    const A = attMonth.filter(a => String(a.staffId) === String(x.id));
    return { st: x, A, L: leaveMonth.filter(l => String(l.staffId) === String(x.id)), mins: A.reduce((t, a) => t + workedMins(a.inTime, a.outTime), 0) };
  });
  const exportStaff = () => downloadCSV(`staff-${staffMonth}.csv`, [
    ['Type', 'Staff', 'Date', 'In / From', 'Out / To', 'Hours / Note'],
    ...attMonth.map(a => ['Attendance', staffNm(a), a.date, a.inTime, a.outTime, a.inTime && a.outTime ? fmtH(workedMins(a.inTime, a.outTime)) : '']),
    ...leaveMonth.map(l => ['Leave', staffNm(l), l.date, l.fromTime, l.toTime, l.note])
  ]);

  // ---------- derived ----------
  const today = todayISO();
  const totalRooms = useMemo(() => Object.values(roomConfig).reduce((s, r) => s + (Number(r.total) || 0), 0), [roomConfig]);
  const todayBookings = bookings.filter(b => bookingCoversDate(b, today));
  const todayDayOut = todayBookings.filter(b => b.type === 'Day Out').reduce((s, b) => s + getBookingRoomCount(b), 0);
  const todayNight = todayBookings.filter(b => b.type === 'Night Out' || b.type === '1 Night Standard').reduce((s, b) => s + getBookingRoomCount(b), 0);

  const calendarDays = useMemo(() => {
    const first = new Date(calYear, calMonth, 1).getDay();
    const n = new Date(calYear, calMonth + 1, 0).getDate();
    const cells = Array(first).fill(null);
    for (let d = 1; d <= n; d++) cells.push({ day: d, iso: `${calYear}-${pad(calMonth + 1)}-${pad(d)}` });
    return cells;
  }, [calYear, calMonth]);
  const selBookings = bookings.filter(b => bookingCoversDate(b, selDate));
  const availability = Object.entries(roomConfig).map(([key, info]) => ({
    key, label: info.label, soft: info.soft,
    available: Math.max(0, (Number(info.total) || 0) - peak(selBookings, key, dayRange(selDate)))
  }));
  const monthlyBookings = useMemo(() => bookings.filter(b => b.date && b.date.startsWith(bookingMonth)).sort((a, b) => a.date.localeCompare(b.date)), [bookings, bookingMonth]);
  const sum = (l, f) => l.reduce((s, b) => s + (Number(f(b)) || 0), 0);
  const stats = useMemo(() => {
    const arr = monthlyBookings.filter(b => b.status === 'arrived'), not = monthlyBookings.filter(b => b.status === 'not_arrived');
    const bySource = {};
    SOURCE_OPTIONS.forEach(src => {
      const l = monthlyBookings.filter(b => normalizeSource(b.source) === src);
      bySource[src] = {
        total: sum(l, b => b.price), adv: sum(l, b => b.advance),
        arr: sum(l.filter(b => b.status === 'arrived'), b => b.price), not: sum(l.filter(b => b.status === 'not_arrived'), b => b.price)
      };
    });
    return { ac: arr.length, at: sum(arr, b => b.price), nc: not.length, nt: sum(not, b => b.price), all: sum(monthlyBookings, b => b.price), adv: sum(monthlyBookings, b => b.advance), bySource };
  }, [monthlyBookings]);
  const monthlyExpenses = useMemo(() => expenses.filter(x => x.date && x.date.startsWith(expenseMonth)).sort((a, b) => b.date.localeCompare(a.date)), [expenses, expenseMonth]);
  const expenseTotal = sum(monthlyExpenses, x => x.amount);

  const changeMonth = (d) => {
    let m = calMonth + d, y = calYear;
    if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; }
    setCalMonth(m); setCalYear(y);
  };

  const exportBookings = () => downloadCSV(`bookings-${bookingMonth}.csv`, [
    ['Date', 'Guest', 'Rooms', 'Package', 'Source', 'Price', 'Advance', 'Balance', 'Status', 'Notes'],
    ...monthlyBookings.map(b => [b.date, b.guest, formatBookingRoomsText(b), renderPackageText(b), normalizeSource(b.source), b.price, b.advance || 0, Math.max(0, (b.price || 0) - (b.advance || 0)), b.status, b.notes])
  ]);
  const exportExpenses = () => downloadCSV(`expenses-${expenseMonth}.csv`, [['Date', 'Title', 'Amount'], ...monthlyExpenses.map(x => [x.date, x.title, x.amount])]);
  const fullBackup = () => downloadJSON(`green-stay-backup-${today}.json`, { bookings, expenses, deleteRequests, roomConfig, staff, attendance, leaves, changeRequests });

  const renderBookingCard = (b) => {
    const decided = b.status === 'arrived' || b.status === 'not_arrived';
    const adv = Number(b.advance) || 0, price = Number(b.price) || 0;
    const hasReq = deleteRequests.some(r => String(r.bookingId) === String(b.id));
    const badge = (st, txt, cls, hov) => b.status === st && (
      <button type="button" disabled={!isAdmin} onClick={() => setStatus(b.id, st === 'arrived' ? 'not_arrived' : 'arrived')}
        className={`inline-block mt-1 text-[11px] px-2 py-0.5 rounded-full font-semibold ${cls} ${isAdmin ? 'cursor-pointer ' + hov : ''}`}>{txt}</button>
    );
    return (
      <div key={b.id} className="bg-white p-3 rounded-xl border border-slate-200 shadow-sm space-y-2">
        <div className="flex justify-between items-start">
          <div>
            <p className="text-sm font-bold text-slate-800">{b.guest}</p>
            <p className="text-xs text-slate-500">{b.date} • {formatBookingRoomsText(b)} • {renderPackageText(b)}</p>
            <p className="text-xs text-slate-600 mt-0.5">කාණ්ඩය: <span className="font-semibold">{normalizeSource(b.source)}</span></p>
            {adv > 0 && <p className="text-xs text-sky-700 mt-0.5">Advance: <span className="font-bold">Rs. {adv.toLocaleString()}</span> • ඉතිරි: <span className="font-semibold">Rs. {Math.max(0, price - adv).toLocaleString()}</span></p>}
            {b.notes && <p className="text-xs text-slate-600 mt-1 bg-slate-50 px-2 py-1 rounded">සටහන: {b.notes}</p>}
            {hasReq && <p className="text-[11px] text-amber-800 bg-amber-50 border border-amber-200 px-2 py-0.5 rounded mt-1 inline-block font-semibold">Delete Request Pending</p>}
          </div>
          <div className="text-right">
            <p className="text-sm font-bold text-emerald-700">Rs. {price.toLocaleString()}</p>
            {badge('arrived', 'පැමිණියා', 'bg-emerald-100 text-emerald-800', 'hover:bg-emerald-200')}
            {badge('not_arrived', 'නොපැමිණි', 'bg-rose-100 text-rose-800', 'hover:bg-rose-200')}
          </div>
        </div>
        {isAdmin && !decided && (
          <div className="flex gap-2 pt-2 border-t border-slate-100">
            <button type="button" onClick={() => setStatus(b.id, 'arrived')} className="flex-1 py-1.5 rounded-lg text-xs font-semibold border bg-emerald-50 text-emerald-700 border-emerald-200"><i className="fa-solid fa-check"></i> පැමිණියා</button>
            <button type="button" onClick={() => setStatus(b.id, 'not_arrived')} className="flex-1 py-1.5 rounded-lg text-xs font-semibold border bg-rose-50 text-rose-700 border-rose-200"><i className="fa-solid fa-xmark"></i> නොපැමිණි</button>
          </div>
        )}
        {isAdmin && (
          <div className="flex items-center justify-end gap-2 pt-1.5 border-t border-slate-100">
            <button type="button" onClick={() => setEditingBooking({ ...b, source: normalizeSource(b.source), roomSelections: getRooms(b).map(i => ({ ...i })) })} className="px-2.5 py-1 rounded-lg text-xs font-semibold bg-slate-100 text-slate-700"><i className="fa-solid fa-pen"></i> Edit</button>
            {isOwner && <button type="button" onClick={() => ownerDelete(b.id)} className="px-2.5 py-1 rounded-lg text-xs font-semibold bg-rose-50 text-rose-700 border border-rose-200"><i className="fa-solid fa-trash"></i> Delete</button>}
            {role === 'admin' && <button type="button" disabled={hasReq} onClick={() => { setDelBooking(b); setDelReason(''); }}
              className={`px-2.5 py-1 rounded-lg text-xs font-semibold border bg-amber-50 text-amber-800 border-amber-300 ${hasReq ? 'opacity-60' : ''}`}><i className="fa-solid fa-paper-plane"></i> {hasReq ? 'Requested' : 'Request Delete'}</button>}
          </div>
        )}
      </div>
    );
  };

  const roleStyle = role === 'owner' ? 'bg-amber-400 text-slate-900 border-amber-300' : role === 'admin' ? 'bg-sky-300 text-slate-900 border-sky-200' : 'bg-emerald-800 text-emerald-200 border-emerald-600';
  const navItems = [['dashboard', 'fa-house', 'Home'], ['calendar', 'fa-calendar-days', 'Calendar'],
    ...(isAdmin ? [['add', 'fa-circle-plus', 'Add'], ['bookings', 'fa-list-check', 'Bookings'], ['expenses', 'fa-receipt', 'Expenses'], ['staff', 'fa-user-clock', 'Staff'], ['rooms', 'fa-bed', 'Rooms']] : [])];
  const card = 'bg-white p-4 rounded-xl border border-slate-200 shadow-sm';

  return (
    <div className="max-w-md mx-auto bg-white min-h-screen shadow-xl relative pb-20">
      <header className="bg-emerald-700 text-white p-4 sticky top-0 z-10 flex justify-between items-center shadow-md">
        <div>
          <h1 className="text-lg font-bold">Green Stay Negombo</h1>
          <p className="text-xs text-emerald-100">කාමර වෙන්කිරීම් කළමනාකරු • {sync}{isOwner && deleteRequests.length + changeRequests.length > 0 ? ` • Requests (${deleteRequests.length + changeRequests.length})` : ''}</p>
        </div>
        <div className="flex items-center gap-1.5">
          <button type="button" onClick={() => pull()} className="text-xs px-2.5 py-1.5 rounded-full bg-emerald-800 text-emerald-100 border border-emerald-600"><i className="fa-solid fa-rotate"></i></button>
          <button type="button" onClick={roleClick} className={`text-xs px-3 py-1.5 rounded-full border flex items-center gap-1.5 font-semibold ${roleStyle}`}>
            <i className={`fa-solid ${isAdmin ? 'fa-lock-open' : 'fa-lock'}`}></i><span>{role === 'owner' ? 'Owner' : role === 'admin' ? 'Admin' : 'View'}</span>
          </button>
        </div>
      </header>

      <main className="p-4">
        {tab === 'dashboard' && (
          <div className="space-y-4">
            {isOwner && changeRequests.length > 0 && (
              <div className="bg-amber-50 border border-amber-300 rounded-xl p-3.5 space-y-2.5">
                <h2 className="text-xs font-bold text-amber-900 uppercase">Edit / Delete Requests ({changeRequests.length})</h2>
                {changeRequests.map(req => (
                  <div key={req.id} className="bg-white p-3 rounded-lg border border-amber-200 space-y-1.5">
                    <p className="text-sm font-bold">{req.kind === 'delete' ? 'Delete Request' : 'Edit Request'}</p>
                    <p className="text-xs text-slate-600">{req.label}</p>
                    <p className="text-xs text-slate-600">හේතුව: <span className="font-semibold">{req.reason}</span></p>
                    <p className="text-[11px] text-slate-400">{req.requestedAt}</p>
                    <div className="flex gap-2 pt-1.5 border-t border-slate-100">
                      {req.kind === 'delete'
                        ? <button type="button" onClick={() => ownerDeleteRec(req.col, req.recId, false)} className="flex-1 py-1.5 rounded-lg text-xs font-bold bg-rose-600 text-white">Approve Delete</button>
                        : <button type="button" onClick={() => openFromReq(req)} className="flex-1 py-1.5 rounded-lg text-xs font-bold bg-emerald-700 text-white">Edit කරන්න</button>}
                      <button type="button" onClick={() => rejectChangeReq(req.id)} className="flex-1 py-1.5 rounded-lg text-xs font-semibold bg-slate-100 text-slate-700">Reject</button>
                    </div>
                  </div>
                ))}
              </div>
            )}
            {isOwner && deleteRequests.length > 0 && (
              <div className="bg-amber-50 border border-amber-300 rounded-xl p-3.5 space-y-2.5">
                <h2 className="text-xs font-bold text-amber-900 uppercase">Delete Requests ({deleteRequests.length})</h2>
                {deleteRequests.map(req => (
                  <div key={req.id} className="bg-white p-3 rounded-lg border border-amber-200 space-y-1.5">
                    <div className="flex justify-between items-start">
                      <div>
                        <p className="text-sm font-bold">{req.snapshot?.guest}</p>
                        <p className="text-xs text-slate-500">{req.snapshot?.date} • {req.snapshot?.rooms} • {req.snapshot?.source}</p>
                        <p className="text-xs text-slate-600 mt-1">හේතුව: <span className="font-semibold">{req.reason}</span></p>
                        <p className="text-[11px] text-slate-400">{req.requestedAt}</p>
                      </div>
                      <span className="text-xs font-bold text-emerald-700">Rs. {Number(req.snapshot?.price || 0).toLocaleString()}</span>
                    </div>
                    <div className="flex gap-2 pt-1.5 border-t border-slate-100">
                      <button type="button" onClick={() => removeBooking(req.bookingId, [req.id])} className="flex-1 py-1.5 rounded-lg text-xs font-bold bg-rose-600 text-white">Approve Delete</button>
                      <button type="button" onClick={() => rejectRequest(req.id)} className="flex-1 py-1.5 rounded-lg text-xs font-semibold bg-slate-100 text-slate-700">Reject</button>
                    </div>
                  </div>
                ))}
              </div>
            )}
            <div className="grid grid-cols-2 gap-3">
              <div className="bg-emerald-50 border border-emerald-200 p-4 rounded-xl text-center"><i className="fa-solid fa-sun text-emerald-600 text-xl mb-1"></i><p className="text-xs text-slate-600">අද Day Out</p><p className="text-2xl font-bold mt-1">{todayDayOut} / {totalRooms}</p></div>
              <div className="bg-indigo-50 border border-indigo-200 p-4 rounded-xl text-center"><i className="fa-solid fa-moon text-indigo-600 text-xl mb-1"></i><p className="text-xs text-slate-600">අද Night / Stay</p><p className="text-2xl font-bold mt-1">{todayNight} / {totalRooms}</p></div>
            </div>
            <div className="bg-slate-50 border border-slate-200 rounded-xl p-3">
              <h2 className="text-xs font-bold text-slate-500 uppercase mb-2">කාමර ධාරිතාව (අද උපරිම)</h2>
              <div className="grid grid-cols-2 gap-2">
                {Object.entries(roomConfig).map(([key, info]) => (
                  <div key={key} className={`p-2.5 rounded-lg border text-xs flex justify-between items-center ${info.soft}`}>
                    <span className="font-semibold">{info.label}</span><span className="font-bold">{peak(todayBookings, key, dayRange(today))}/{info.total}</span>
                  </div>
                ))}
              </div>
            </div>
            <div className="bg-emerald-50/60 border border-emerald-100 rounded-xl p-3.5">
              <h2 className="text-sm font-bold text-emerald-900 mb-2.5"><i className="fa-solid fa-bell text-emerald-700"></i> ඊළඟ Booking සටහන්</h2>
              {bookings.filter(b => b.date >= today).length === 0 ? <p className="text-xs text-slate-500 text-center py-4">ඉදිරි Bookings කිසිවක් නොමැත.</p> : (
                <div className="space-y-2">
                  {bookings.filter(b => b.date >= today).sort((a, b) => a.date.localeCompare(b.date)).slice(0, 5).map(b => (
                    <div key={b.id} className="bg-white p-3 rounded-lg border border-slate-100 shadow-sm flex justify-between items-center">
                      <div>
                        <p className="text-sm font-bold">{b.guest} <span className="text-xs font-normal text-slate-500">({formatBookingRoomsText(b)})</span></p>
                        <p className="text-xs text-slate-500">{b.date} • {renderPackageText(b)}</p>
                      </div>
                      <span className="text-xs font-bold text-emerald-700">Rs. {Number(b.price).toLocaleString()}</span>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        )}

        {tab === 'calendar' && (
          <div className="space-y-4">
            <div className="bg-white border border-slate-200 rounded-xl p-3 shadow-sm">
              <div className="flex justify-between items-center mb-3">
                <button onClick={() => changeMonth(-1)} className="w-8 h-8 rounded-lg bg-slate-100"><i className="fa-solid fa-chevron-left text-xs"></i></button>
                <h2 className="text-sm font-bold">{calYear} {SI_MONTHS[calMonth]}</h2>
                <button onClick={() => changeMonth(1)} className="w-8 h-8 rounded-lg bg-slate-100"><i className="fa-solid fa-chevron-right text-xs"></i></button>
              </div>
              <div className="grid grid-cols-7 gap-1 text-center mb-1">{SI_DAYS.map(d => <div key={d} className="text-[11px] font-semibold text-slate-400 py-1">{d}</div>)}</div>
              <div className="grid grid-cols-7 gap-1">
                {calendarDays.map((cell, i) => {
                  if (!cell) return <div key={i} className="h-10"></div>;
                  const has = bookings.some(b => bookingCoversDate(b, cell.iso));
                  const sel = selDate === cell.iso;
                  return (
                    <button key={cell.iso} onClick={() => setSelDate(cell.iso)} className={`h-10 rounded-lg flex flex-col items-center justify-center text-xs ${sel ? 'bg-emerald-700 text-white font-bold shadow' : today === cell.iso ? 'bg-emerald-50 text-emerald-800 font-bold border border-emerald-300' : 'hover:bg-slate-100 text-slate-700'}`}>
                      <span>{cell.day}</span>{has && <span className={`w-1.5 h-1.5 rounded-full mt-0.5 ${sel ? 'bg-amber-300' : 'bg-emerald-600'}`}></span>}
                    </button>
                  );
                })}
              </div>
            </div>
            <div className={card}>
              <h3 className="text-xs font-bold text-slate-600 uppercase mb-2">{selDate} ඉතිරි Rooms (එදින වඩාත්ම පිරෙන වෙලාව අනුව)</h3>
              <div className="grid grid-cols-2 gap-2">
                {availability.map(it => (
                  <div key={it.key} className={`p-2.5 rounded-lg border text-xs flex justify-between items-center ${it.available > 0 ? it.soft : 'bg-rose-50 text-rose-700 border-rose-200'}`}>
                    <span className="font-semibold">{it.label}</span><span className="font-bold">{it.available > 0 ? `${it.available} ඉතිරි` : 'නැත'}</span>
                  </div>
                ))}
              </div>
            </div>
            <div className="bg-slate-50 border border-slate-200 rounded-xl p-3.5">
              <h3 className="text-sm font-bold mb-3">{selDate} Bookings ({selBookings.length})</h3>

            <BookingForm f={formData} set={setFormData} cfg={roomConfig} onSubmit={(e) => { e.preventDefault(); saveBooking(formData, true); }} submitLabel="Booking එක Save කරන්න" />

            <div className="grid grid-cols-2 gap-3">
              <div><Lbl t="සිට" /><input type="time" value={editingLeave.fromTime || ''} onChange={e => setEditingLeave({ ...editingLeave, fromTime: e.target.value })} className={inp} /></div>
              <div><Lbl t="දක්වා" /><input type="time" value={editingLeave.toTime || ''} onChange={e => setEditingLeave({ ...editingLeave, toTime: e.target.value })} className={inp} /></div>
            </div>
            <div><Lbl t="සටහන" /><input type="text" value={editingLeave.note || ''} onChange={e => setEditingLeave({ ...editingLeave, note: e.target.value })} className={inp} /></div>
            <div className="flex gap-2">
              <button type="button" onClick={() => setEditingLeave(null)} className="flex-1 py-2 rounded-xl border border-slate-300 text-xs font-semibold">Cancel</button>
              <button type="submit" className="flex-1 py-2 rounded-xl bg-emerald-700 text-white text-xs font-bold">Save Changes</button>
            </div>
          </form>
        </Modal>
      )}

      <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-slate-200 flex justify-around py-2 z-20 shadow-lg">
        {navItems.map(([id, icon, label]) => (
          <button key={id} onClick={() => setTab(id)} className={`flex flex-col items-center text-[11px] px-1 py-1 ${tab === id ? 'text-emerald-700 font-bold' : 'text-slate-500'}`}>
            <i className={`fa-solid ${icon} text-base mb-0.5`}></i><span>{label}</span>
          </button>
        ))}
      </nav>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
