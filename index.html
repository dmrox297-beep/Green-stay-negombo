<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Green Stay Negombo - Room Booking</title>

  <!-- Tailwind CSS & FontAwesome Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- React & Babel -->
  <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.25.6/babel.min.js"></script>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Sinhala:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', 'Noto Sans Sinhala', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 pb-20">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, useCallback } = React;

    const ADMIN_PIN = 'N1357';
    const OWNER_PIN = 'Lm914L';
    // ඔබේ Firebase Realtime Database URL එක ඇතුළත් කර ඇත
    const FIREBASE_DB_URL = 'https://green-stay-hotel-negombo-default-rtdb.asia-southeast1.firebasedatabase.app';

    const DEFAULT_ROOM_CONFIG = {
      Double: { label: 'Double Room', total: 4, color: 'bg-teal-700', soft: 'bg-teal-50 text-teal-800 border-teal-200' },
      Cabana: { label: 'Cabana', total: 5, color: 'bg-amber-600', soft: 'bg-amber-50 text-amber-800 border-amber-200' },
      Triple: { label: 'Triple Room', total: 2, color: 'bg-stone-700', soft: 'bg-stone-100 text-stone-800 border-stone-300' },
      Family: { label: 'Family Room', total: 1, color: 'bg-rose-700', soft: 'bg-rose-50 text-rose-800 border-rose-200' }
    };

    const EXTRA_STYLES = [
      { color: 'bg-cyan-700', soft: 'bg-cyan-50 text-cyan-800 border-cyan-200' },
      { color: 'bg-indigo-700', soft: 'bg-indigo-50 text-indigo-800 border-indigo-200' },
      { color: 'bg-emerald-700', soft: 'bg-emerald-50 text-emerald-800 border-emerald-200' },
      { color: 'bg-purple-700', soft: 'bg-purple-50 text-purple-800 border-purple-200' }
    ];

    const PACKAGES = [
      { id: 'Day Out', label: 'Day Out (10:00 AM - 5:00 PM)' },
      { id: 'Night Out', label: 'Night Out (6:30 PM - 8:00 AM)' },
      { id: '1 Night Standard', label: '1 Night Standard (2:00 PM - 11:00 AM)' },
      { id: 'Custom Time', label: 'Custom Time' }
    ];

    const SOURCE_OPTIONS = ['Nirmal', 'Nirmal booking sites', 'Travel Corner', 'Maple Leaf'];

    const SI_MONTHS = ['ජනවාරි', 'පෙබරවාරි', 'මාර්තු', 'අප්‍රේල්', 'මැයි', 'ජූනි', 'ජූලි', 'අගෝස්තු', 'සැප්තැම්බර්', 'ඔක්තෝබර්', 'නොවැම්බර්', 'දෙසැම්බර්'];
    const SI_DAYS = ['ඉරි', 'සඳු', 'අඟ', 'බදා', 'බ්‍රහ', 'සිකු', 'සෙන'];

    function normalizeSource(src) {
      if (!src || src === 'Other' || src === 'වෙනත්') return 'Maple Leaf';
      if (src === 'Nirmal booking.com') return 'Nirmal booking sites';
      return SOURCE_OPTIONS.includes(src) ? src : 'Maple Leaf';
    }

    function todayISO() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function currentMonthISO() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    }

    function formatMonthLabel(ym) {
      if (!ym) return '';
      const [y, m] = ym.split('-').map(Number);
      return `${y} ${SI_MONTHS[m - 1]}`;
    }

    function parseISODateUTC(iso) {
      const [y, m, d] = iso.split('-').map(Number);
      return new Date(Date.UTC(y, m - 1, d));
    }

    function formatISODateUTC(dateObj) {
      const y = dateObj.getUTCFullYear();
      const m = String(dateObj.getUTCMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getUTCDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function getBookingDateRange(booking) {
      if (!booking || !booking.date) return { start: '', end: '' };
      const start = booking.type === 'Custom Time' && booking.customCheckInDate ? booking.customCheckInDate : booking.date;
      const end = booking.type === 'Custom Time' && booking.customCheckOutDate ? booking.customCheckOutDate : start;
      const effectiveEnd = end >= start ? end : start;
      return { start, end: effectiveEnd };
    }

    function getDatesInRange(startISO, endISO) {
      if (!startISO) return [];
      const effectiveEnd = endISO && endISO >= startISO ? endISO : startISO;
      const dates = [];
      const cur = parseISODateUTC(startISO);
      const last = parseISODateUTC(effectiveEnd);
      while (cur <= last) {
        dates.push(formatISODateUTC(cur));
        cur.setUTCDate(cur.getUTCDate() + 1);
      }
      return dates;
    }

    function bookingCoversDate(booking, isoDate) {
      if (!booking || !booking.date || !isoDate) return false;
      const { start, end } = getBookingDateRange(booking);
      return isoDate >= start && isoDate <= end;
    }

    function getBookingRoomCount(booking, roomKey = null) {
      if (Array.isArray(booking.roomSelections) && booking.roomSelections.length > 0) {
        if (roomKey) {
          return booking.roomSelections
            .filter(item => item.roomType === roomKey)
            .reduce((sum, item) => sum + (Number(item.qty) || 1), 0);
        }
        return booking.roomSelections.reduce((sum, item) => sum + (Number(item.qty) || 1), 0);
      }
      const fallbackQty = Number(booking.roomQty) || 1;
      if (roomKey) {
        return booking.roomType === roomKey ? fallbackQty : 0;
      }
      return fallbackQty;
    }

    function formatBookingRoomsText(booking) {
      if (Array.isArray(booking.roomSelections) && booking.roomSelections.length > 0) {
        return booking.roomSelections
          .map(item => `${item.roomType} x${Number(item.qty) || 1}`)
          .join(', ');
      }
      const qty = Number(booking.roomQty) || 1;
      return qty > 1 ? `${booking.roomType} x${qty}` : booking.roomType;
    }

    function getCleanFirebaseBaseUrl() {
      if (!FIREBASE_DB_URL || !FIREBASE_DB_URL.trim()) return '';
      return FIREBASE_DB_URL.trim().replace(/\/+$/, '');
    }

    // Convert Firebase object map ({ id1: item1, id2: item2 }) or array into clean array
    function firebaseCollectionToArray(raw) {
      if (!raw) return [];
      if (Array.isArray(raw)) {
        return raw.filter(item => item && typeof item === 'object' && item.id != null);
      }
      if (typeof raw === 'object') {
        return Object.entries(raw)
          .filter(([, val]) => val && typeof val === 'object')
          .map(([key, val]) => ({
            ...val,
            id: val.id != null ? val.id : (Number.isNaN(Number(key)) ? key : Number(key))
          }));
      }
      return [];
    }

    function App() {
      const [role, setRole] = useState(() => {
        const saved = localStorage.getItem('gs_user_role_v1');
        return saved === 'admin' || saved === 'owner' ? saved : 'view';
      });
      const isAdmin = role === 'admin' || role === 'owner';
      const isOwner = role === 'owner';

      const [showPinModal, setShowPinModal] = useState(false);
      const [pinInput, setPinInput] = useState('');
      const [pinError, setPinError] = useState('');

      const [tab, setTab] = useState('dashboard');
      const [syncStatus, setSyncStatus] = useState(() => getCleanFirebaseBaseUrl() ? 'Syncing' : 'Local');

      const [roomConfig, setRoomConfig] = useState(() => {
        const saved = localStorage.getItem('gs_room_config_v1');
        return saved ? JSON.parse(saved) : DEFAULT_ROOM_CONFIG;
      });

      const [newRoomName, setNewRoomName] = useState('');
      const [newRoomTotal, setNewRoomTotal] = useState('1');

      const [bookings, setBookings] = useState(() => {
        const saved = localStorage.getItem('gs_bookings_v4');
        const list = saved ? JSON.parse(saved) : [];
        return Array.isArray(list) ? list.map(b => ({ ...b, source: normalizeSource(b.source) })) : [];
      });

      const [deleteRequests, setDeleteRequests] = useState(() => {
        const saved = localStorage.getItem('gs_delete_requests_v1');
        return saved ? JSON.parse(saved) : [];
      });

      const [expenses, setExpenses] = useState(() => {
        const saved = localStorage.getItem('gs_expenses_v1');
        return saved ? JSON.parse(saved) : [];
      });

      const roomKeys = Object.keys(roomConfig);
      const defaultRoomKey = roomKeys[0] || 'Double';

      const [formData, setFormData] = useState({
        guest: '',
        price: '',
        advance: '',
        source: 'Nirmal',
        notes: '',
        roomSelections: [{ roomType: defaultRoomKey, qty: 1 }],
        type: 'Day Out',
        customCheckInDate: todayISO(),
        customCheckInTime: '',
        customCheckOutDate: todayISO(),
        customCheckOutTime: '',
        date: todayISO()
      });

      const [requestingDeleteBooking, setRequestingDeleteBooking] = useState(null);
      const [deleteReason, setDeleteReason] = useState('');
      const [editingBooking, setEditingBooking] = useState(null);
      const [editingExpense, setEditingExpense] = useState(null);

      const [calYear, setCalYear] = useState(() => new Date().getFullYear());
      const [calMonth, setCalMonth] = useState(() => new Date().getMonth());
      const [selectedCalDate, setSelectedCalDate] = useState(todayISO());

      const [bookingFilterMonth, setBookingFilterMonth] = useState(currentMonthISO());
      const [expenseFilterMonth, setExpenseFilterMonth] = useState(currentMonthISO());

      const [expForm, setExpForm] = useState({
        title: '',
        amount: '',
        date: todayISO()
      });

      const isMutatingRef = useRef(false);

      useEffect(() => {
        localStorage.setItem('gs_user_role_v1', role);
      }, [role]);

      useEffect(() => {
        localStorage.setItem('gs_room_config_v1', JSON.stringify(roomConfig));
      }, [roomConfig]);

      useEffect(() => {
        localStorage.setItem('gs_bookings_v4', JSON.stringify(bookings));
      }, [bookings]);

      useEffect(() => {
        localStorage.setItem('gs_delete_requests_v1', JSON.stringify(deleteRequests));
      }, [deleteRequests]);

      useEffect(() => {
        localStorage.setItem('gs_expenses_v1', JSON.stringify(expenses));
      }, [expenses]);

      // Write or delete a single record by ID in Firebase
      const upsertRecord = useCallback(async (collectionName, id, recordObj) => {
        const baseUrl = getCleanFirebaseBaseUrl();
        if (!baseUrl) return true;
        isMutatingRef.current = true;
        try {
          const res = await fetch(`${baseUrl}/greenStayNegombo/${collectionName}/${id}.json`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(recordObj)
          });
          if (res.ok) {
            setSyncStatus('Live');
            return true;
          }
          setSyncStatus('Error');
          return false;
        } catch (err) {
          setSyncStatus('Offline');
          return false;
        } finally {
          setTimeout(() => { isMutatingRef.current = false; }, 300);
        }
      }, []);

      const deleteRecordById = useCallback(async (collectionName, id) => {
        const baseUrl = getCleanFirebaseBaseUrl();
        if (!baseUrl) return true;
        isMutatingRef.current = true;
        try {
          const res = await fetch(`${baseUrl}/greenStayNegombo/${collectionName}/${id}.json`, {
            method: 'DELETE'
          });
          if (res.ok) {
            setSyncStatus('Live');
            return true;
          }
          setSyncStatus('Error');
          return false;
        } catch (err) {
          setSyncStatus('Offline');
          return false;
        } finally {
          setTimeout(() => { isMutatingRef.current = false; }, 300);
        }
      }, []);

      const pushRoomConfig = useCallback(async (nextConfig) => {
        const baseUrl = getCleanFirebaseBaseUrl();
        if (!baseUrl) return true;
        isMutatingRef.current = true;
        try {
          const res = await fetch(`${baseUrl}/greenStayNegombo/roomConfig.json`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(nextConfig)
          });
          if (res.ok) {
            setSyncStatus('Live');
            return true;
          }
          setSyncStatus('Error');
          return false;
        } catch (err) {
          setSyncStatus('Offline');
          return false;
        } finally {
          setTimeout(() => { isMutatingRef.current = false; }, 300);
        }
      }, []);

      // Fetch latest server state and replace local state cleanly (server is source of truth)
      const pullFromServer = useCallback(async () => {
        const baseUrl = getCleanFirebaseBaseUrl();
        if (!baseUrl) {
          setSyncStatus('Local');
          return null;
        }
        if (isMutatingRef.current) return null;

        try {
          const res = await fetch(`${baseUrl}/greenStayNegombo.json?t=${Date.now()}`, {
            cache: 'no-store'
          });
          if (!res.ok) throw new Error('Network error');
          const data = await res.json();

          if (isMutatingRef.current) return null;

          const remoteBookings = firebaseCollectionToArray(data?.bookings)
            .map(b => ({ ...b, source: normalizeSource(b.source) }));
          const remoteExpenses = firebaseCollectionToArray(data?.expenses);
          const remoteRequests = firebaseCollectionToArray(data?.deleteRequests);
          const remoteRooms = data?.roomConfig && typeof data.roomConfig === 'object'
            ? data.roomConfig
            : DEFAULT_ROOM_CONFIG;

          setBookings(prev => JSON.stringify(prev) === JSON.stringify(remoteBookings) ? prev : remoteBookings);
          setExpenses(prev => JSON.stringify(prev) === JSON.stringify(remoteExpenses) ? prev : remoteExpenses);
          setDeleteRequests(prev => JSON.stringify(prev) === JSON.stringify(remoteRequests) ? prev : remoteRequests);
          setRoomConfig(prev => JSON.stringify(prev) === JSON.stringify(remoteRooms) ? prev : remoteRooms);

          setSyncStatus('Live');
          return { remoteBookings, remoteExpenses, remoteRequests, remoteRooms };
        } catch (err) {
          setSyncStatus('Offline');
          return null;
        }
      }, []);

      useEffect(() => {
        const baseUrl = getCleanFirebaseBaseUrl();
        if (!baseUrl) {
          setSyncStatus('Local');
          return;
        }
        let cancelled = false;
        const tick = async () => {
          if (!cancelled) await pullFromServer();
        };
        tick();
        const intervalId = setInterval(tick, 3000);
        return () => {
          cancelled = true;
          clearInterval(intervalId);
        };
      }, [pullFromServer]);

      useEffect(() => {
        if (!isAdmin && (tab === 'add' || tab === 'bookings' || tab === 'expenses' || tab === 'rooms')) {
          setTab('dashboard');
        }
      }, [isAdmin, tab]);

      const findOverbookingConflict = (candidateBooking, ignoreBookingId = null, referenceBookings = bookings) => {
        const { start, end } = getBookingDateRange(candidateBooking);
        const datesToCheck = getDatesInRange(start, end);

        const requestedByType = {};
        const selections = Array.isArray(candidateBooking.roomSelections) && candidateBooking.roomSelections.length > 0
          ? candidateBooking.roomSelections
          : [{ roomType: candidateBooking.roomType || defaultRoomKey, qty: Number(candidateBooking.roomQty) || 1 }];

        selections.forEach(item => {
          const rType = item.roomType || defaultRoomKey;
          const q = Math.max(1, Number(item.qty) || 1);
          requestedByType[rType] = (requestedByType[rType] || 0) + q;
        });

        for (const iso of datesToCheck) {
          const dayBookings = referenceBookings.filter(b => b.id !== ignoreBookingId && bookingCoversDate(b, iso));
          for (const [rType, reqQty] of Object.entries(requestedByType)) {
            const maxCapacity = Number(roomConfig[rType]?.total ?? 0);
            const alreadyBooked = dayBookings.reduce((sum, b) => sum + getBookingRoomCount(b, rType), 0);
            if (alreadyBooked + reqQty > maxCapacity) {
              const label = roomConfig[rType]?.label || rType;
              const availableLeft = Math.max(0, maxCapacity - alreadyBooked);
              return `${iso} දිනට ${label} සඳහා ඉතිරිව ඇත්තේ ${availableLeft}/${maxCapacity} පමණි. Overbooking කළ නොහැක!`;
            }
          }
        }
        return null;
      };

      const handleRoleButtonClick = () => {
        if (role !== 'view') {
          setRole('view');
        } else {
          setPinInput('');
          setPinError('');
          setShowPinModal(true);
        }
      };

      const handleVerifyPin = (e) => {
        e.preventDefault();
        const trimmed = pinInput.trim();
        if (trimmed === OWNER_PIN) {
          setRole('owner');
          localStorage.setItem('gs_user_role_v1', 'owner');
          setShowPinModal(false);
          setPinInput('');
          setPinError('');
        } else if (trimmed === ADMIN_PIN) {
          setRole('admin');
          localStorage.setItem('gs_user_role_v1', 'admin');
          setShowPinModal(false);
          setPinInput('');
          setPinError('');
        } else {
          setPinError('PIN අංකය වැරදියි. නැවත උත්සාහ කරන්න.');
        }
      };

      const adjustRoomCount = async (key, delta) => {
        if (!isAdmin) return;
        const current = roomConfig[key];
        if (!current) return;
        const nextTotal = Math.max(0, Number(current.total || 0) + delta);
        const nextConfig = {
          ...roomConfig,
          [key]: { ...current, total: nextTotal }
        };
        setRoomConfig(nextConfig);
        await pushRoomConfig(nextConfig);
      };

      const handleAddRoomType = async (e) => {
        e.preventDefault();
        if (!isAdmin) return;
        const cleanName = newRoomName.trim();
        const count = Math.max(0, Number(newRoomTotal) || 0);
        if (!cleanName) return alert('කරුණාකර Room වර්ගයේ නම ඇතුළත් කරන්න.');
        if (roomConfig[cleanName]) return alert('මෙම Room වර්ගය දැනටමත් පවතී.');

        const style = EXTRA_STYLES[Object.keys(roomConfig).length % EXTRA_STYLES.length];
        const nextConfig = {
          ...roomConfig,
          [cleanName]: {
            label: cleanName,
            total: count,
            color: style.color,
            soft: style.soft
          }
        };
        setRoomConfig(nextConfig);
        await pushRoomConfig(nextConfig);
        setNewRoomName('');
        setNewRoomTotal('1');
      };

      const updateFormRoomSelection = (index, field, value) => {
        setFormData(prev => {
          const updated = [...prev.roomSelections];
          updated[index] = {
            ...updated[index],
            [field]: field === 'qty' ? Math.max(1, Number(value) || 1) : value
          };
          return { ...prev, roomSelections: updated };
        });
      };

      const addFormRoomRow = () => {
        setFormData(prev => ({
          ...prev,
          roomSelections: [...prev.roomSelections, { roomType: defaultRoomKey, qty: 1 }]
        }));
      };

      const removeFormRoomRow = (index) => {
        setFormData(prev => {
          if (prev.roomSelections.length <= 1) return prev;
          return {
            ...prev,
            roomSelections: prev.roomSelections.filter((_, idx) => idx !== index)
          };
        });
      };

      const updateEditRoomSelection = (index, field, value) => {
        setEditingBooking(prev => {
          const list = Array.isArray(prev.roomSelections) && prev.roomSelections.length > 0
            ? [...prev.roomSelections]
            : [{ roomType: prev.roomType || defaultRoomKey, qty: Number(prev.roomQty) || 1 }];
          list[index] = {
            ...list[index],
            [field]: field === 'qty' ? Math.max(1, Number(value) || 1) : value
          };
          return { ...prev, roomSelections: list, roomType: list[0].roomType };
        });
      };

      const addEditRoomRow = () => {
        setEditingBooking(prev => {
          const list = Array.isArray(prev.roomSelections) && prev.roomSelections.length > 0
            ? [...prev.roomSelections]
            : [{ roomType: prev.roomType || defaultRoomKey, qty: Number(prev.roomQty) || 1 }];
          list.push({ roomType: defaultRoomKey, qty: 1 });
          return { ...prev, roomSelections: list };
        });
      };

      const removeEditRoomRow = (index) => {
        setEditingBooking(prev => {
          const list = Array.isArray(prev.roomSelections) ? prev.roomSelections : [];
          if (list.length <= 1) return prev;
          const filtered = list.filter((_, idx) => idx !== index);
          return { ...prev, roomSelections: filtered, roomType: filtered[0].roomType };
        });
      };

      const handleAddBooking = async (e) => {
        e.preventDefault();
        if (!isAdmin) return;
        if (!formData.guest.trim() || !formData.price) {
          return alert('කරුණාකර Guest Name සහ Price ඇතුළත් කරන්න.');
        }

        const latest = await pullFromServer();
        const baseList = latest ? latest.remoteBookings : bookings;

        const isCustom = formData.type === 'Custom Time';
        const effectiveDate = isCustom && formData.customCheckInDate ? formData.customCheckInDate : formData.date;
        const cleanSelections = formData.roomSelections.map(item => ({
          roomType: item.roomType || defaultRoomKey,
          qty: Math.max(1, Number(item.qty) || 1)
        }));
        const totalQty = cleanSelections.reduce((sum, item) => sum + item.qty, 0);

        const newBooking = {
          id: Date.now(),
          guest: formData.guest.trim(),
          price: Number(formData.price),
          advance: Number(formData.advance) || 0,
          source: normalizeSource(formData.source),
          notes: formData.notes.trim(),
          roomType: cleanSelections[0]?.roomType || defaultRoomKey,
          roomQty: totalQty,
          roomSelections: cleanSelections,
          type: formData.type,
          customCheckInDate: isCustom ? (formData.customCheckInDate || effectiveDate) : '',
          customCheckInTime: isCustom ? formData.customCheckInTime : '',
          customCheckOutDate: isCustom ? (formData.customCheckOutDate || formData.customCheckInDate || effectiveDate) : '',
          customCheckOutTime: isCustom ? formData.customCheckOutTime : '',
          date: effectiveDate,
          status: 'pending'
        };

        const conflictMessage = findOverbookingConflict(newBooking, null, baseList);
        if (conflictMessage) {
          return alert(conflictMessage);
        }

        setBookings([newBooking, ...baseList]);
        await upsertRecord('bookings', newBooking.id, newBooking);

        setFormData({
          guest: '',
          price: '',
          advance: '',
          source: 'Nirmal',
          notes: '',
          roomSelections: [{ roomType: defaultRoomKey, qty: 1 }],
          type: 'Day Out',
          customCheckInDate: todayISO(),
          customCheckInTime: '',
          customCheckOutDate: todayISO(),
          customCheckOutTime: '',
          date: todayISO()
        });
        setBookingFilterMonth(newBooking.date.slice(0, 7));
        setTab('bookings');
      };

      const handleSaveEdit = async (e) => {
        e.preventDefault();
        if (!isAdmin) return;
        if (!editingBooking.guest.trim() || editingBooking.price === '') {
          return alert('කරුණාකර Guest Name සහ Price ඇතුළත් කරන්න.');
        }

        const latest = await pullFromServer();
        const baseList = latest ? latest.remoteBookings : bookings;

        const isCustom = editingBooking.type === 'Custom Time';
        const effectiveDate = isCustom && editingBooking.customCheckInDate ? editingBooking.customCheckInDate : editingBooking.date;
        const cleanSelections = Array.isArray(editingBooking.roomSelections) && editingBooking.roomSelections.length > 0
          ? editingBooking.roomSelections.map(item => ({
              roomType: item.roomType || defaultRoomKey,
              qty: Math.max(1, Number(item.qty) || 1)
            }))
          : [{ roomType: editingBooking.roomType || defaultRoomKey, qty: Math.max(1, Number(editingBooking.roomQty) || 1) }];
        const totalQty = cleanSelections.reduce((sum, item) => sum + item.qty, 0);

        const updatedBooking = {
          ...editingBooking,
          guest: editingBooking.guest.trim(),
          price: Number(editingBooking.price),
          advance: Number(editingBooking.advance) || 0,
          source: normalizeSource(editingBooking.source),
          notes: (editingBooking.notes || '').trim(),
          roomType: cleanSelections[0]?.roomType || defaultRoomKey,
          roomQty: totalQty,
          roomSelections: cleanSelections,
          customCheckInDate: isCustom ? (editingBooking.customCheckInDate || effectiveDate) : '',
          customCheckInTime: isCustom ? (editingBooking.customCheckInTime || '') : '',
          customCheckOutDate: isCustom ? (editingBooking.customCheckOutDate || editingBooking.customCheckInDate || effectiveDate) : '',
          customCheckOutTime: isCustom ? (editingBooking.customCheckOutTime || '') : '',
          date: effectiveDate
        };

        const conflictMessage = findOverbookingConflict(updatedBooking, editingBooking.id, baseList);
        if (conflictMessage) {
          return alert(conflictMessage);
        }

        const exists = baseList.some(b => String(b.id) === String(editingBooking.id));
        const nextList = exists
          ? baseList.map(b => (String(b.id) === String(editingBooking.id) ? updatedBooking : b))
          : [updatedBooking, ...baseList];

        setBookings(nextList);
        await upsertRecord('bookings', updatedBooking.id, updatedBooking);
        setEditingBooking(null);
      };

      const selectAttendanceStatus = async (id, status) => {
        if (!isAdmin) return;
        const target = bookings.find(b => String(b.id) === String(id));
        if (!target) return;
        const updated = { ...target, status };
        setBookings(bookings.map(b => (String(b.id) === String(id) ? updated : b)));
        await upsertRecord('bookings', updated.id, updated);
      };

      const toggleAttendanceBadge = async (id, currentStatus) => {
        if (!isAdmin) return;
        const nextStatus = currentStatus === 'arrived' ? 'not_arrived' : 'arrived';
        const target = bookings.find(b => String(b.id) === String(id));
        if (!target) return;
        const updated = { ...target, status: nextStatus };
        setBookings(bookings.map(b => (String(b.id) === String(id) ? updated : b)));
        await upsertRecord('bookings', updated.id, updated);
      };

      const openDeleteRequestModal = (booking) => {
        setRequestingDeleteBooking(booking);
        setDeleteReason('');
      };

      const handleSubmitDeleteRequest = async (e) => {
        e.preventDefault();
        if (!isAdmin || !requestingDeleteBooking) return;

        const latest = await pullFromServer();
        const baseRequests = latest ? latest.remoteRequests : deleteRequests;

        const alreadyRequested = baseRequests.some(r => String(r.bookingId) === String(requestingDeleteBooking.id));
        if (alreadyRequested) {
          alert('මෙම Booking එක සඳහා Delete Request එකක් දැනටමත් Owner වෙත යවා ඇත.');
          setRequestingDeleteBooking(null);
          return;
        }

        const newReq = {
          id: Date.now(),
          bookingId: requestingDeleteBooking.id,
          requestedBy: 'Admin',
          requestedAt: new Date().toLocaleString('si-LK'),
          reason: deleteReason.trim() || 'හේතුවක් සඳහන් කර නැත',
          snapshot: {
            guest: requestingDeleteBooking.guest,
            date: requestingDeleteBooking.date,
            rooms: formatBookingRoomsText(requestingDeleteBooking),
            price: Number(requestingDeleteBooking.price) || 0,
            source: normalizeSource(requestingDeleteBooking.source)
          }
        };

        setDeleteRequests([newReq, ...baseRequests]);
        await upsertRecord('deleteRequests', newReq.id, newReq);
        setRequestingDeleteBooking(null);
        setDeleteReason('');
        alert('Delete Request එක Owner වෙත යවන ලදී. Owner approve කළ පසු delete වනු ඇත.');
      };

      const ownerDeleteBooking = async (id) => {
        if (!isOwner) return;
        if (confirm('Owner ලෙස මෙම Booking එක සම්පූර්ණයෙන්ම ඉවත් කිරීමට අවශ්‍යද?')) {
          const matchingReqs = deleteRequests.filter(r => String(r.bookingId) === String(id));
          setBookings(prev => prev.filter(b => String(b.id) !== String(id)));
          setDeleteRequests(prev => prev.filter(r => String(r.bookingId) !== String(id)));
          await deleteRecordById('bookings', id);
          for (const r of matchingReqs) {
            await deleteRecordById('deleteRequests', r.id);
          }
        }
      };

      const handleApproveDeleteRequest = async (req) => {
        if (!isOwner) return;
        setBookings(prev => prev.filter(b => String(b.id) !== String(req.bookingId)));
        setDeleteRequests(prev => prev.filter(r => String(r.id) !== String(req.id)));
        await deleteRecordById('bookings', req.bookingId);
        await deleteRecordById('deleteRequests', req.id);
      };

      const handleRejectDeleteRequest = async (reqId) => {
        if (!isOwner) return;
        setDeleteRequests(prev => prev.filter(r => String(r.id) !== String(reqId)));
        await deleteRecordById('deleteRequests', reqId);
      };

      const handleAddExpense = async (e) => {
        e.preventDefault();
        if (!isAdmin) return;
        if (!expForm.title.trim() || !expForm.amount) {
          return alert('කරුණාකර වියදම් විස්තරය සහ මුදල ඇතුළත් කරන්න.');
        }

        const latest = await pullFromServer();
        const baseExpenses = latest ? latest.remoteExpenses : expenses;

        const newExpense = {
          id: Date.now(),
          title: expForm.title.trim(),
          amount: Number(expForm.amount),
          date: expForm.date
        };

        setExpenses([newExpense, ...baseExpenses]);
        await upsertRecord('expenses', newExpense.id, newExpense);
        setExpenseFilterMonth(newExpense.date.slice(0, 7));
        setExpForm({
          title: '',
          amount: '',
          date: todayISO()
        });
      };

      const handleSaveExpenseEdit = async (e) => {
        e.preventDefault();
        if (!isAdmin) return;
        if (!editingExpense.title.trim() || editingExpense.amount === '') {
          return alert('කරුණාකර වියදම් විස්තරය සහ මුදල ඇතුළත් කරන්න.');
        }

        const latest = await pullFromServer();
        const baseExpenses = latest ? latest.remoteExpenses : expenses;

        const cleanedItem = {
          ...editingExpense,
          title: editingExpense.title.trim(),
          amount: Number(editingExpense.amount),
          date: editingExpense.date
        };

        const exists = baseExpenses.some(ex => String(ex.id) === String(editingExpense.id));
        const nextExpenses = exists
          ? baseExpenses.map(ex => (String(ex.id) === String(editingExpense.id) ? cleanedItem : ex))
          : [cleanedItem, ...baseExpenses];

        setExpenses(nextExpenses);
        await upsertRecord('expenses', cleanedItem.id, cleanedItem);
        setEditingExpense(null);
      };

      const deleteExpense = async (id) => {
        if (!isAdmin) return;
        if (confirm('මෙම වියදම ඉවත් කිරීමට අවශ්‍යද?')) {
          setExpenses(prev => prev.filter(ex => String(ex.id) !== String(id)));
          await deleteRecordById('expenses', id);
        }
      };

      const totalRoomsCapacity = useMemo(() => {
        return Object.values(roomConfig).reduce((sum, r) => sum + (Number(r.total) || 0), 0);
      }, [roomConfig]);

      const today = todayISO();
      const todayBookings = bookings.filter(b => bookingCoversDate(b, today));
      const todayDayOut = todayBookings
        .filter(b => b.type === 'Day Out')
        .reduce((sum, b) => sum + getBookingRoomCount(b), 0);
      const todayNightOut = todayBookings
        .filter(b => b.type === 'Night Out' || b.type === '1 Night Standard')
        .reduce((sum, b) => sum + getBookingRoomCount(b), 0);

      const calendarDays = useMemo(() => {
        const firstDay = new Date(calYear, calMonth, 1).getDay();
        const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
        const cells = [];
        for (let i = 0; i < firstDay; i++) cells.push(null);
        for (let d = 1; d <= daysInMonth; d++) {
          const iso = `${calYear}-${String(calMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          cells.push({ day: d, iso });
        }
        return cells;
      }, [calYear, calMonth]);

      const selectedDateBookings = bookings.filter(b => bookingCoversDate(b, selectedCalDate));

      const selectedDateAvailability = useMemo(() => {
        const entries = Object.entries(roomConfig);
        const orderedEntries = [
          ...entries.filter(([k]) => k === 'Cabana'),
          ...entries.filter(([k]) => k !== 'Cabana').slice(0, 3)
        ];
        return orderedEntries.map(([key, info]) => {
          const total = Number(info.total) || 0;
          const booked = selectedDateBookings.reduce((sum, b) => sum + getBookingRoomCount(b, key), 0);
          const available = Math.max(0, total - booked);
          return {
            key,
            label: info.label,
            available,
            soft: info.soft
          };
        });
      }, [roomConfig, selectedDateBookings]);

      const monthlyBookings = useMemo(() => {
        return bookings
          .filter(b => b.date && b.date.startsWith(bookingFilterMonth))
          .sort((a, b) => a.date.localeCompare(b.date));
      }, [bookings, bookingFilterMonth]);

      const bookingStats = useMemo(() => {
        const arrivedList = monthlyBookings.filter(b => b.status === 'arrived');
        const notArrivedList = monthlyBookings.filter(b => b.status === 'not_arrived');
        const arrivedTotal = arrivedList.reduce((sum, b) => sum + (Number(b.price) || 0), 0);
        const notArrivedTotal = notArrivedList.reduce((sum, b) => sum + (Number(b.price) || 0), 0);
        const allTotal = monthlyBookings.reduce((sum, b) => sum + (Number(b.price) || 0), 0);
        const allAdvanceTotal = monthlyBookings.reduce((sum, b) => sum + (Number(b.advance) || 0), 0);

        const bySource = {};
        SOURCE_OPTIONS.forEach(src => {
          const list = monthlyBookings.filter(b => normalizeSource(b.source) === src);
          const sourceTotal = list.reduce((sum, b) => sum + (Number(b.price) || 0), 0);
          const advanceTotal = list.reduce((sum, b) => sum + (Number(b.advance) || 0), 0);
          const arrivedSrcTotal = list
            .filter(b => b.status === 'arrived')
            .reduce((sum, b) => sum + (Number(b.price) || 0), 0);
          const notArrivedSrcTotal = list
            .filter(b => b.status === 'not_arrived')
            .reduce((sum, b) => sum + (Number(b.price) || 0), 0);
          bySource[src] = { sourceTotal, advanceTotal, arrivedSrcTotal, notArrivedSrcTotal };
        });

        return {
          arrivedCount: arrivedList.length,
          arrivedTotal,
          notArrivedCount: notArrivedList.length,
          notArrivedTotal,
          allTotal,
          allAdvanceTotal,
          bySource
        };
      }, [monthlyBookings]);

      const monthlyExpenses = useMemo(() => {
        return expenses
          .filter(ex => ex.date && ex.date.startsWith(expenseFilterMonth))
          .sort((a, b) => b.date.localeCompare(a.date));
      }, [expenses, expenseFilterMonth]);

      const monthlyExpenseTotal = useMemo(() => {
        return monthlyExpenses.reduce((sum, ex) => sum + (Number(ex.amount) || 0), 0);
      }, [monthlyExpenses]);

      const changeCalMonth = (delta) => {
        let m = calMonth + delta;
        let y = calYear;
        if (m < 0) { m = 11; y -= 1; }
        if (m > 11) { m = 0; y += 1; }
        setCalMonth(m);
        setCalYear(y);
      };

      const renderPackageText = (b) => {
        if (b.type === 'Custom Time') {
          const ciDate = b.customCheckInDate || b.date || '';
          const ciTime = b.customCheckInTime || '--:--';
          const coDate = b.customCheckOutDate || b.customCheckInDate || b.date || '';
          const coTime = b.customCheckOutTime || '--:--';
          return `Custom (${ciDate} ${ciTime} → ${coDate} ${coTime})`;
        }
        return b.type;
      };

      const renderBookingCard = (b, showDeleteControl = true) => {
        const isDecided = b.status === 'arrived' || b.status === 'not_arrived';
        const adv = Number(b.advance) || 0;
        const price = Number(b.price) || 0;
        const balance = Math.max(0, price - adv);
        const srcLabel = normalizeSource(b.source);
        const hasPendingDeleteReq = deleteRequests.some(r => String(r.bookingId) === String(b.id));

        return (
          <div key={b.id} className="bg-white p-3 rounded-xl border border-slate-200 shadow-sm space-y-2">
            <div className="flex justify-between items-start">
              <div>
                <p className="text-sm font-bold text-slate-800">{b.guest}</p>
                <p className="text-xs text-slate-500">{b.date} • {formatBookingRoomsText(b)} • {renderPackageText(b)}</p>
                <p className="text-xs text-slate-600 mt-0.5">කාණ්ඩය: <span className="font-semibold">{srcLabel}</span></p>
                {adv > 0 && (
                  <p className="text-xs text-sky-700 mt-0.5">
                    Advance: <span className="font-bold">Rs. {adv.toLocaleString()}</span> • ඉතිරි: <span className="font-semibold">Rs. {balance.toLocaleString()}</span>
                  </p>
                )}
                {b.notes && <p className="text-xs text-slate-600 mt-1 bg-slate-50 px-2 py-1 rounded">සටහන: {b.notes}</p>}
                {hasPendingDeleteReq && (
                  <p className="text-[11px] text-amber-800 bg-amber-50 border border-amber-200 px-2 py-0.5 rounded mt-1 inline-block font-semibold">
                    Delete Request Pending (Owner Approval)
                  </p>
                )}
              </div>
              <div className="text-right">
                <p className="text-sm font-bold text-emerald-700">Rs. {price.toLocaleString()}</p>
                {b.status === 'arrived' && (
                  <button
                    type="button"
                    disabled={!isAdmin}
                    onClick={() => toggleAttendanceBadge(b.id, b.status)}
                    title={isAdmin ? 'ඔබා වෙනස් කරන්න' : ''}
                    className={`inline-block mt-1 text-[11px] px-2 py-0.5 rounded-full font-semibold bg-emerald-100 text-emerald-800 ${
                      isAdmin ? 'cursor-pointer hover:bg-emerald-200 active:scale-95 transition' : ''
                    }`}
                  >
                    පැමිණියා
                  </button>
                )}
                {b.status === 'not_arrived' && (
                  <button
                    type="button"
                    disabled={!isAdmin}
                    onClick={() => toggleAttendanceBadge(b.id, b.status)}
                    title={isAdmin ? 'ඔබා වෙනස් කරන්න' : ''}
                    className={`inline-block mt-1 text-[11px] px-2 py-0.5 rounded-full font-semibold bg-rose-100 text-rose-800 ${
                      isAdmin ? 'cursor-pointer hover:bg-rose-200 active:scale-95 transition' : ''
                    }`}
                  >
                    නොපැමිණි
                  </button>
                )}
              </div>
            </div>

            {isAdmin && !isDecided && (
              <div className="flex gap-2 pt-2 border-t border-slate-100">
                <button
                  type="button"
                  onClick={() => selectAttendanceStatus(b.id, 'arrived')}
                  className="flex-1 py-1.5 rounded-lg text-xs font-semibold border bg-emerald-50 text-emerald-700 border-emerald-200 hover:bg-emerald-100 flex items-center justify-center gap-1"
                >
                  <i className="fa-solid fa-check"></i> පැමිණියා
                </button>
                <button
                  type="button"
                  onClick={() => selectAttendanceStatus(b.id, 'not_arrived')}
                  className="flex-1 py-1.5 rounded-lg text-xs font-semibold border bg-rose-50 text-rose-700 border-rose-200 hover:bg-rose-100 flex items-center justify-center gap-1"
                >
                  <i className="fa-solid fa-xmark"></i> නොපැමිණි
                </button>
              </div>
            )}

            {isAdmin && (
              <div className="flex items-center justify-end gap-2 pt-1.5 border-t border-slate-100">
                <button
                  type="button"
                  onClick={() => setEditingBooking({
                    ...b,
                    source: normalizeSource(b.source),
                    roomSelections: Array.isArray(b.roomSelections) && b.roomSelections.length > 0
                      ? b.roomSelections
                      : [{ roomType: b.roomType || defaultRoomKey, qty: Number(b.roomQty) || 1 }]
                  })}
                  className="px-2.5 py-1 rounded-lg text-xs font-semibold bg-slate-100 text-slate-700 hover:bg-slate-200 flex items-center gap-1"
                >
                  <i className="fa-solid fa-pen"></i> Edit
                </button>

                {showDeleteControl && isOwner && (
                  <button
                    type="button"
                    onClick={() => ownerDeleteBooking(b.id)}
                    className="px-2.5 py-1 rounded-lg text-xs font-semibold bg-rose-50 text-rose-700 border border-rose-200 hover:bg-rose-100 flex items-center gap-1"
                    title="Delete Booking"
                  >
                    <i className="fa-solid fa-trash"></i> Delete
                  </button>
                )}

                {showDeleteControl && role === 'admin' && (
                  <button
                    type="button"
                    disabled={hasPendingDeleteReq}
                    onClick={() => openDeleteRequestModal(b)}
                    className={`px-2.5 py-1 rounded-lg text-xs font-semibold border flex items-center gap-1 ${
                      hasPendingDeleteReq
                        ? 'bg-amber-50 text-amber-700 border-amber-200 opacity-75 cursor-not-allowed'
                        : 'bg-amber-50 text-amber-800 border-amber-300 hover:bg-amber-100'
                    }`}
                  >
                    <i className="fa-solid fa-paper-plane"></i> {hasPendingDeleteReq ? 'Requested' : 'Request Delete'}
                  </button>
                )}
              </div>
            )}
          </div>
        );
      };

      const roleBadgeText = role === 'owner' ? 'Owner' : role === 'admin' ? 'Admin' : 'View';
      const roleBadgeStyle = role === 'owner'
        ? 'bg-amber-400 text-slate-900 border-amber-300'
        : role === 'admin'
        ? 'bg-sky-300 text-slate-900 border-sky-200'
        : 'bg-emerald-800 text-emerald-200 border-emerald-600 hover:bg-emerald-900';

      return (
        <div className="max-w-md mx-auto bg-white min-h-screen shadow-xl relative pb-20">
          {/* Header */}
          <header className="bg-emerald-700 text-white p-4 sticky top-0 z-10 flex justify-between items-center shadow-md">
            <div>
              <h1 className="text-lg font-bold">Green Stay Negombo</h1>
              <p className="text-xs text-emerald-100">
                කාමර වෙන්කිරීම් කළමනාකරු • {syncStatus}
                {isOwner && deleteRequests.length > 0 ? ` • Requests (${deleteRequests.length})` : ''}
              </p>
            </div>
            <div className="flex items-center gap-1.5">
              <button
                type="button"
                onClick={() => pullFromServer()}
                title="Refresh Data"
                className="text-xs px-2.5 py-1.5 rounded-full bg-emerald-800 text-emerald-100 border border-emerald-600 hover:bg-emerald-900"
              >
                <i className="fa-solid fa-rotate"></i>
              </button>
              <button
                type="button"
                onClick={handleRoleButtonClick}
                className={`text-xs px-3 py-1.5 rounded-full border flex items-center gap-1.5 font-semibold transition ${roleBadgeStyle}`}
              >
                <i className={`fa-solid ${isAdmin ? 'fa-lock-open' : 'fa-lock'}`}></i>
                <span>{roleBadgeText}</span>
              </button>
            </div>
          </header>

          {/* Content Body */}
          <main className="p-4">
            {/* 1. DASHBOARD TAB */}
            {tab === 'dashboard' && (
              <div className="space-y-4">
                {isOwner && deleteRequests.length > 0 && (
                  <div className="bg-amber-50 border border-amber-300 rounded-xl p-3.5 space-y-2.5 shadow-sm">
                    <h2 className="text-xs font-bold text-amber-900 uppercase flex items-center gap-1.5">
                      <i className="fa-solid fa-triangle-exclamation text-amber-600"></i>
                      Delete Requests ({deleteRequests.length})
                    </h2>
                    {deleteRequests.map(req => (
                      <div key={req.id} className="bg-white p-3 rounded-lg border border-amber-200 space-y-1.5">
                        <div className="flex justify-between items-start">
                          <div>
                            <p className="text-sm font-bold text-slate-800">{req.snapshot?.guest}</p>
                            <p className="text-xs text-slate-500">
                              {req.snapshot?.date} • {req.snapshot?.rooms} • {req.snapshot?.source}
                            </p>
                            <p className="text-xs text-slate-600 mt-1">
                              හේතුව: <span className="font-semibold">{req.reason}</span>
                            </p>
                            <p className="text-[11px] text-slate-400">{req.requestedAt}</p>
                          </div>
                          <span className="text-xs font-bold text-emerald-700">
                            Rs. {Number(req.snapshot?.price || 0).toLocaleString()}

                    type="month"
                    value={expenseFilterMonth}
                    onChange={e => setExpenseFilterMonth(e.target.value)}
                    className="text-xs font-bold border border-slate-300 rounded-lg px-2.5 py-1.5 text-slate-800"
                  />
                </div>

                <div className="bg-rose-50 border border-rose-200 p-4 rounded-xl flex justify-between items-center">
                  <div>
                    <p className="text-xs font-semibold text-rose-800">{formatMonthLabel(expenseFilterMonth)} මුළු වියදම්</p>
                    <p className="text-[11px] text-rose-600">Total Expenses ({monthlyExpenses.length} items)</p>
                  </div>
                  <p className="text-lg font-bold text-rose-900">Rs. {monthlyExpenseTotal.toLocaleString()}</p>
                </div>

                <div className="space-y-2">
                  {monthlyExpenses.length === 0 ? (
                    <div className="bg-white p-6 rounded-xl border border-slate-200 text-center text-xs text-slate-500">
                      මෙම මාසය සඳහා වියදම් සටහන් නොමැත.
                    </div>
                  ) : (
                    monthlyExpenses.map(ex => (
                      <div key={ex.id} className="bg-white p-3 rounded-xl border border-slate-200 shadow-sm flex justify-between items-center">
                        <div>
                          <p className="text-sm font-bold text-slate-800">{ex.title}</p>
                          <p className="text-xs text-slate-500">{ex.date}</p>
                        </div>
                        <div className="flex items-center gap-2">
                          <span className="text-sm font-bold text-rose-700 mr-1">Rs. {Number(ex.amount).toLocaleString()}</span>
                          <button
                            type="button"
                            onClick={() => setEditingExpense({ ...ex })}
                            className="px-2 py-1 rounded-lg text-xs font-semibold bg-slate-100 text-slate-700 hover:bg-slate-200 flex items-center gap-1"
                            title="Edit"
                          >
                            <i className="fa-solid fa-pen"></i> Edit
                          </button>
                          <button
                            type="button"
                            onClick={() => deleteExpense(ex.id)}
                            className="text-slate-400 hover:text-rose-600 px-1.5 py-1 text-xs"
                            title="Delete"
                          >
                            <i className="fa-solid fa-trash"></i>
                          </button>
                        </div>
                      </div>
                    ))
                  )}
                </div>
              </div>
            )}

            {/* 6. ROOMS SETTINGS TAB */}
            {tab === 'rooms' && isAdmin && (
              <div className="space-y-4">
                <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-3">
                  <h2 className="text-sm font-bold text-slate-800 border-b pb-2">කාමර ප්‍රමාණයන් වෙනස් කරන්න</h2>
                  <div className="space-y-2">
                    {Object.entries(roomConfig).map(([key, info]) => (
                      <div key={key} className="flex items-center justify-between bg-slate-50 p-2.5 rounded-xl border border-slate-200">
                        <div>
                          <p className="text-sm font-bold text-slate-800">{info.label}</p>
                          <p className="text-xs text-slate-500">ප්‍රමාණය: {info.total}</p>
                        </div>
                        <div className="flex items-center gap-2">
                          <button
                            type="button"
                            onClick={() => adjustRoomCount(key, -1)}
                            className="w-8 h-8 rounded-lg bg-white border border-slate-300 text-slate-700 font-bold flex items-center justify-center hover:bg-slate-100"
                          >
                            -
                          </button>
                          <span className="w-6 text-center text-sm font-bold">{info.total}</span>
                          <button
                            type="button"
                            onClick={() => adjustRoomCount(key, 1)}
                            className="w-8 h-8 rounded-lg bg-emerald-700 text-white font-bold flex items-center justify-center hover:bg-emerald-800"
                          >
                            +
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                <form onSubmit={handleAddRoomType} className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-3">
                  <h2 className="text-sm font-bold text-slate-800 border-b pb-2">අලුත් Room වර්ගයක් Add කරන්න</h2>
                  <div className="grid grid-cols-3 gap-2">
                    <div className="col-span-2">
                      <label className="block text-xs font-semibold text-slate-600 mb-1">Room වර්ගයේ නම</label>
                      <input
                        type="text"
                        required
                        placeholder="උදා: Deluxe Room"
                        value={newRoomName}
                        onChange={e => setNewRoomName(e.target.value)}
                        className="w-full p-2 text-sm border border-slate-300 rounded-lg"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">ගණන</label>
                      <input
                        type="number"
                        required
                        min="0"
                        value={newRoomTotal}
                        onChange={e => setNewRoomTotal(e.target.value)}
                        className="w-full p-2 text-sm border border-slate-300 rounded-lg"
                      />
                    </div>
                  </div>
                  <button
                    type="submit"
                    className="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-2.5 rounded-xl text-sm shadow transition"
                  >
                    <i className="fa-solid fa-plus mr-1.5"></i> Room වර්ගය Add කරන්න
                  </button>
                </form>
              </div>
            )}
          </main>

          {/* PIN Modal */}
          {showPinModal && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
              <form onSubmit={handleVerifyPin} className="bg-white w-full max-w-xs rounded-2xl p-4 space-y-3 shadow-2xl">
                <div className="flex justify-between items-center border-b pb-2">
                  <h3 className="text-sm font-bold text-slate-800">PIN ඇතුළත් කරන්න</h3>
                  <button type="button" onClick={() => setShowPinModal(false)} className="text-slate-400 hover:text-slate-700">
                    <i className="fa-solid fa-xmark"></i>
                  </button>
                </div>
                <div>
                  <input
                    type="password"
                    required
                    autoFocus
                    placeholder="Admin / Owner PIN"
                    value={pinInput}
                    onChange={e => setPinInput(e.target.value)}
                    className="w-full p-2.5 text-sm border border-slate-300 rounded-lg"
                  />
                  {pinError && <p className="text-xs text-rose-600 mt-1">{pinError}</p>}
                </div>
                <div className="flex gap-2">
                  <button
                    type="button"
                    onClick={() => setShowPinModal(false)}
                    className="flex-1 py-2 rounded-xl border border-slate-300 text-xs font-semibold text-slate-700"
                  >
                    Cancel
                  </button>
                  <button
                    type="submit"
                    className="flex-1 py-2 rounded-xl bg-emerald-700 text-white text-xs font-bold"
                  >
                    Unlock
                  </button>
                </div>
              </form>
            </div>
          )}

          {/* Admin Delete Request Modal */}
          {requestingDeleteBooking && role === 'admin' && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
              <form onSubmit={handleSubmitDeleteRequest} className="bg-white w-full max-w-sm rounded-2xl p-4 space-y-3 shadow-2xl">
                <div className="flex justify-between items-center border-b pb-2">
                  <h3 className="text-sm font-bold text-slate-800">Owner වෙත Delete Request යවන්න</h3>
                  <button type="button" onClick={() => setRequestingDeleteBooking(null)} className="text-slate-400 hover:text-slate-700">
                    <i className="fa-solid fa-xmark"></i>
                  </button>
                </div>
                <p className="text-xs text-slate-600">
                  Booking: <span className="font-bold text-slate-800">{requestingDeleteBooking.guest}</span> ({requestingDeleteBooking.date})
                </p>
                <div>
                  <label className="block text-xs font-semibold text-slate-600 mb-1">Delete කිරීමට හේතුව</label>
                  <textarea
                    rows="2"
                    placeholder="උදා: Guest cancelled / Duplicate booking"
                    value={deleteReason}
                    onChange={e => setDeleteReason(e.target.value)}
                    className="w-full p-2 text-xs border border-slate-300 rounded-lg"
                  ></textarea>
                </div>
                <div className="flex gap-2 pt-1">
                  <button
                    type="button"
                    onClick={() => setRequestingDeleteBooking(null)}
                    className="flex-1 py-2 rounded-xl border border-slate-300 text-xs font-semibold text-slate-700"
                  >
                    Cancel
                  </button>
                  <button
                    type="submit"
                    className="flex-1 py-2 rounded-xl bg-amber-500 text-slate-900 text-xs font-bold"
                  >
                    Request යවන්න
                  </button>
                </div>
              </form>
            </div>
          )}

          {/* Edit Booking Modal */}
          {editingBooking && isAdmin && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
              <form onSubmit={handleSaveEdit} className="bg-white w-full max-w-md rounded-2xl p-4 space-y-3 shadow-2xl max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center border-b pb-2">
                  <h3 className="text-sm font-bold text-slate-800">Booking Edit කරන්න</h3>
                  <button type="button" onClick={() => setEditingBooking(null)} className="text-slate-400 hover:text-slate-700">
                    <i className="fa-solid fa-xmark text-base"></i>
                  </button>
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-600 mb-1">Guest Name</label>
                  <input
                    type="text"
                    required
                    value={editingBooking.guest}
                    onChange={e => setEditingBooking({ ...editingBooking, guest: e.target.value })}
                    className="w-full p-2 text-sm border border-slate-300 rounded-lg"
                  />
                </div>

                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1">Price (Rs.)</label>
                    <input
                      type="number"
                      required
                      min="0"
                      value={editingBooking.price}
                      onChange={e => setEditingBooking({ ...editingBooking, price: e.target.value })}
                      className="w-full p-2 text-sm border border-slate-300 rounded-lg"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1">Advance (Rs.)</label>
                    <input
                      type="number"
                      min="0"
                      value={editingBooking.advance || ''}
                      onChange={e => setEditingBooking({ ...editingBooking, advance: e.target.value })}
                      className="w-full p-2 text-sm border border-slate-300 rounded-lg"
                    />
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-600 mb-1">කාණ්ඩය (Source)</label>
                  <select
                    value={normalizeSource(editingBooking.source)}
                    onChange={e => setEditingBooking({ ...editingBooking, source: e.target.value })}
                    className="w-full p-2 text-sm border border-slate-300 rounded-lg bg-white"
                  >
                    {SOURCE_OPTIONS.map(src => (
                      <option key={src} value={src}>{src}</option>
                    ))}
                  </select>
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-600 mb-1">සටහන් (Notes)</label>
                  <textarea
                    rows="2"
                    value={editingBooking.notes || ''}
                    onChange={e => setEditingBooking({ ...editingBooking, notes: e.target.value })}
                    className="w-full p-2 text-sm border border-slate-300 rounded-lg"
                  ></textarea>
                </div>

                <div className="space-y-2 bg-slate-50 p-2.5 rounded-xl border border-slate-200">
                  <div className="flex justify-between items-center">
                    <label className="text-xs font-bold text-slate-700">Room Types & Quantity</label>
                    <button
                      type="button"
                      onClick={addEditRoomRow}
                      className="text-xs font-bold text-emerald-700 bg-emerald-50 border border-emerald-200 px-2 py-0.5 rounded-lg"
                    >
                      + Room
                    </button>
                  </div>
                  {(editingBooking.roomSelections || []).map((item, idx) => (
                    <div key={idx} className="grid grid-cols-12 gap-2 items-center">
                      <div className="col-span-7">
                        <select
                          value={item.roomType}
                          onChange={e => updateEditRoomSelection(idx, 'roomType', e.target.value)}
                          className="w-full p-1.5 text-xs border border-slate-300 rounded-lg bg-white"
                        >
                          {roomKeys.map(r => (
                            <option key={r} value={r}>{roomConfig[r]?.label || r}</option>
                          ))}
                        </select>
                      </div>
                      <div className="col-span-3">
                        <input
                          type="number"
                          min="1"
                          value={item.qty}
                          onChange={e => updateEditRoomSelection(idx, 'qty', e.target.value)}
                          className="w-full p-1.5 text-xs border border-slate-300 rounded-lg bg-white text-center font-bold"
                        />
                      </div>
                      <div className="col-span-2 flex justify-end">
                        {(editingBooking.roomSelections || []).length > 1 && (
                          <button
                            type="button"
                            onClick={() => removeEditRoomRow(idx)}
                            className="text-rose-600 p-1.5 text-xs"
                          >
                            <i className="fa-solid fa-trash"></i>
                          </button>
                        )}
                      </div>
                    </div>
                  ))}
                </div>

                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1">දිනය (Date)</label>
                    <input
                      type="date"
                      required
                      value={editingBooking.date}
                      onChange={e => setEditingBooking({ ...editingBooking, date: e.target.value, customCheckInDate: e.target.value })}
                      className="w-full p-2 text-sm border border-slate-300 rounded-lg"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1">Package</label>
                    <select
                      value={editingBooking.type}
                      onChange={e => setEditingBooking({
                        ...editingBooking,
                        type: e.target.value,
                        customCheckInDate: editingBooking.customCheckInDate || editingBooking.date,
                        customCheckOutDate: editingBooking.customCheckOutDate || editingBooking.date
                      })}
                      className="w-full p-2 text-sm border border-slate-300 rounded-lg bg-white"
                    >
                      {PACKAGES.map(p => (
                        <option key={p.id} value={p.id}>{p.label}</option>
                      ))}
                    </select>
                  </div>
                </div>

                {editingBooking.type === 'Custom Time' && (
                  <div className="space-y-2.5 bg-slate-50 p-2.5 rounded-xl border border-slate-200">
                    <div>
                      <p className="text-xs font-bold text-slate-700 mb-1">Check-in දිනය සහ වේලාව</p>
                      <div className="grid grid-cols-2 gap-2">
                        <input
                          type="date"
                          value={editingBooking.customCheckInDate || editingBooking.date || ''}
                          onChange={e => setEditingBooking({ ...editingBooking, customCheckInDate: e.target.value, date: e.target.value })}
                          className="w-full p-2 text-xs border border-slate-300 rounded-lg bg-white"
                        />
                        <input
                          type="time"
                          value={editingBooking.customCheckInTime || ''}
                          onChange={e => setEditingBooking({ ...editingBooking, customCheckInTime: e.target.value })}
                          className="w-full p-2 text-xs border border-slate-300 rounded-lg bg-white"
                        />
                      </div>
                    </div>
                    <div>
                      <p className="text-xs font-bold text-slate-700 mb-1">Check-out දිනය සහ වේලාව</p>
                      <div className="grid grid-cols-2 gap-2">
                        <input
                          type="date"
                          value={editingBooking.customCheckOutDate || editingBooking.customCheckInDate || editingBooking.date || ''}
                          onChange={e => setEditingBooking({ ...editingBooking, customCheckOutDate: e.target.value })}
                          className="w-full p-2 text-xs border border-slate-300 rounded-lg bg-white"
                        />
                        <input
                          type="time"
                          value={editingBooking.customCheckOutTime || ''}
                          onChange={e => setEditingBooking({ ...editingBooking, customCheckOutTime: e.target.value })}
                          className="w-full p-2 text-xs border border-slate-300 rounded-lg bg-white"
                        />
                      </div>
                    </div>
                  </div>
                )}

                <div className="flex gap-2 pt-2">
                  <button
                    type="button"
                    onClick={() => setEditingBooking(null)}
                    className="flex-1 py-2 rounded-xl border border-slate-300 text-xs font-semibold text-slate-700"
                  >
                    Cancel
                  </button>
                  <button
                    type="submit"
                    className="flex-1 py-2 rounded-xl bg-emerald-700 text-white text-xs font-bold"
                  >
                    Save Changes
                  </button>
                </div>
              </form>
            </div>
          )}

          {/* Edit Expense Modal */}
          {editingExpense && isAdmin && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
              <form onSubmit={handleSaveExpenseEdit} className="bg-white w-full max-w-md rounded-2xl p-4 space-y-3 shadow-2xl">
                <div className="flex justify-between items-center border-b pb-2">
                  <h3 className="text-sm font-bold text-slate-800">වියදම Edit කරන්න</h3>
                  <button type="button" onClick={() => setEditingExpense(null)} className="text-slate-400 hover:text-slate-700">
                    <i className="fa-solid fa-xmark text-base"></i>
                  </button>
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-600 mb-1">වියදම් විස්තරය</label>
                  <input
                    type="text"
                    required
                    value={editingExpense.title}
                    onChange={e => setEditingExpense({ ...editingExpense, title: e.target.value })}
                    className="w-full p-2 text-sm border border-slate-300 rounded-lg"
                  />
                </div>

                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1">මුදල (Rs.)</label>
                    <input
                      type="number"
                      required
                      min="0"
                      value={editingExpense.amount}
                      onChange={e => setEditingExpense({ ...editingExpense, amount: e.target.value })}
                      className="w-full p-2 text-sm border border-slate-300 rounded-lg"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1">දිනය</label>
                    <input
                      type="date"
                      required
                      value={editingExpense.date}
                      onChange={e => setEditingExpense({ ...editingExpense, date: e.target.value })}
                      className="w-full p-2 text-sm border border-slate-300 rounded-lg"
                    />
                  </div>
                </div>

                <div className="flex gap-2 pt-2">
                  <button
                    type="button"
                    onClick={() => setEditingExpense(null)}
                    className="flex-1 py-2 rounded-xl border border-slate-300 text-xs font-semibold text-slate-700"
                  >
                    Cancel
                  </button>
                  <button
                    type="submit"
                    className="flex-1 py-2 rounded-xl bg-rose-600 text-white text-xs font-bold"
                  >
                    Save Changes
                  </button>
                </div>
              </form>
            </div>
          )}

          {/* Bottom Navigation Bar */}
          <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-slate-200 flex justify-around py-2 z-20 shadow-lg">
            <button
              onClick={() => setTab('dashboard')}
              className={`flex flex-col items-center text-[11px] px-2 py-1 ${tab === 'dashboard' ? 'text-emerald-700 font-bold' : 'text-slate-500'}`}
            >
              <i className="fa-solid fa-house text-base mb-0.5"></i>
              <span>Home</span>
            </button>
            <button
              onClick={() => setTab('calendar')}
              className={`flex flex-col items-center text-[11px] px-2 py-1 ${tab === 'calendar' ? 'text-emerald-700 font-bold' : 'text-slate-500'}`}
            >
              <i className="fa-solid fa-calendar-days text-base mb-0.5"></i>
              <span>Calendar</span>
            </button>
            {isAdmin && (
              <>
                <button
                  onClick={() => setTab('add')}
                  className={`flex flex-col items-center text-[11px] px-2 py-1 ${tab === 'add' ? 'text-emerald-700 font-bold' : 'text-slate-500'}`}
                >
                  <i className="fa-solid fa-circle-plus text-base mb-0.5"></i>
                  <span>Add</span>
                </button>
                <button
                  onClick={() => setTab('bookings')}
                  className={`flex flex-col items-center text-[11px] px-2 py-1 ${tab === 'bookings' ? 'text-emerald-700 font-bold' : 'text-slate-500'}`}
                >
                  <i className="fa-solid fa-list-check text-base mb-0.5"></i>
                  <span>Bookings</span>
                </button>
                <button
                  onClick={() => setTab('expenses')}
                  className={`flex flex-col items-center text-[11px] px-2 py-1 ${tab === 'expenses' ? 'text-emerald-700 font-bold' : 'text-slate-500'}`}
                >
                  <i className="fa-solid fa-receipt text-base mb-0.5"></i>
                  <span>Expenses</span>
                </button>
                <button
                  onClick={() => setTab('rooms')}
                  className={`flex flex-col items-center text-[11px] px-2 py-1 ${tab === 'rooms' ? 'text-emerald-700 font-bold' : 'text-slate-500'}`}
                >
                  <i className="fa-solid fa-bed text-base mb-0.5"></i>
                  <span>Rooms</span>
                </button>
              </>
            )}
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
